        const group = tpl.group || 'grpOth';
        if (!grouped[group]) grouped[group] = [];
        grouped[group].push({ tpl });
      });
      return grouped;
    },
    readConfig: function() {
      const pt = this.state.partType;
      const cfg = { type: pt };

      // 🔢 Zahlen, 🔤 Buchstaben, 🔀 Gemischt, ✨ Sonderzeichen
      if (['numbers', 'letters', 'mixed', 'special'].includes(pt)) {
        // Quantifier-Modus aus Button lesen
        const modal = document.getElementById('snippet-modal');
        const quantifierModeBtn = modal?.querySelector('[data-quantifier-mode].active');
        const quantifierMode = quantifierModeBtn ? quantifierModeBtn.getAttribute('data-quantifier-mode') : 'custom';
        cfg.quantifierMode = quantifierMode;
        
        if (quantifierMode === 'optional') {
          cfg.min = 0;
          cfg.max = 1;
        } else if (quantifierMode === 'zeroOrMore') {
          cfg.min = 0;
          cfg.max = '';
        } else if (quantifierMode === 'oneOrMore') {
          cfg.min = 1;
          cfg.max = '';
        } else {
          // Custom-Modus: Min/Max aus Inputs lesen
          cfg.min = parseInt(document.getElementById('cfg-min')?.value || '1', 10);
          
          // Min-Mode aus Button lesen
          const minModeBtn = modal?.querySelector('[data-min-mode].active');
          const minMode = minModeBtn ? minModeBtn.getAttribute('data-min-mode') : 'upTo';
          cfg.minMode = minMode;
          
          if (minMode === 'exact') {
            // Bei "Genau" wird max = min gesetzt
            cfg.max = cfg.min;
          } else {
            // Bei "Bis zu" wird max aus Input gelesen
            cfg.max = parseInt(document.getElementById('cfg-max')?.value || '', 10) || '';
          }
        }
        
        cfg.whitelist = document.getElementById('cfg-whitelist')?.value.split('\n').filter(Boolean);
        cfg.blacklist = document.getElementById('cfg-blacklist')?.value.split('\n').filter(Boolean);
        
        // Prüfmodus aus Button lesen (statt select)
        const modeBtn = modal?.querySelector('[data-mode].active');
        cfg.mode = modeBtn ? modeBtn.getAttribute('data-mode') : 'char';
        
        cfg.extraChars = document.getElementById('cfg-extra')?.value || ''; // optional für mixed
      }

      // 📝 Text
      if (pt === 'text') {
        cfg.value = document.getElementById('cfg-val')?.value || '';
      }

      // ↔️ Auswahl
      if (pt === 'choice') {
        cfg.choices = document.getElementById('cfg-choices')?.value.split('\n').filter(Boolean);
      }

      // Trennzeichen
      if (pt === 'delimiter') {
        cfg.value = document.getElementById('delimiter-value')?.value || '';
      }

      // ✅ Whitelist
      if (pt === 'whitelist') {
        cfg.values = document.getElementById('whitelist-values')?.value.split('\n').filter(Boolean);
        // Checkboxen lesen - nur eine sollte aktiv sein
        const charChecked = document.getElementById('whitelist-mode-char')?.checked;
        const termChecked = document.getElementById('whitelist-mode-term')?.checked;
        cfg.mode = termChecked ? 'term' : (charChecked ? 'char' : 'char');
      }

      // ⛔ Blacklist
      if (pt === 'blacklist') {
        cfg.values = document.getElementById('blacklist-values')?.value.split('\n').filter(Boolean);
        // Checkboxen lesen - nur eine sollte aktiv sein
        const charChecked = document.getElementById('blacklist-mode-char')?.checked;
        const termChecked = document.getElementById('blacklist-mode-term')?.checked;
        const containsChecked = document.getElementById('blacklist-mode-contains')?.checked;
        if (containsChecked) cfg.mode = 'contains';
        else if (termChecked) cfg.mode = 'term';
        else cfg.mode = 'char';
      }

      return cfg;
    },

        htmlParts.push(`
          <div class="form-group">
            <label class="form-label">

              ${typeof window.renderTooltip !== 'undefined' ? window.renderTooltip({

                why: { de: 'Bestimmt, wie oft das Pattern vorkommen darf', en: 'Determines how often the pattern can occur' },

              </button>
              <button class="selector-text-btn ${quantifierMode === 'oneOrMore' ? 'active' : ''}" data-quantifier-mode="oneOrMore" type="button" style="white-space: normal; line-height: 1.3;">
                ${this.t('quantifierOneOrMore') || 'Mindestens eins'}<br><small style="font-size: 0.85em;">${this.t('quantifierOneOrMoreDesc') || '1+ Mal (+)'}</small>
              </button>
              <button class="selector-text-btn ${quantifierMode === 'custom' ? 'active' : ''}" data-quantifier-mode="custom" type="button" style="white-space: normal; line-height: 1.3;">
                ${this.t('quantifierCustom') || 'Benutzerdefiniert'}<br><small style="font-size: 0.85em;">${this.t('quantifierCustomDesc') || 'Genau/Bis zu'}</small>

          <div class="form-group" id="quantifier-custom-group" style="${quantifierMode !== 'custom' ? 'display: none;' : ''}">
            <label class="form-label">
              ${this.t('min')}
              ${typeof window.renderTooltip !== 'undefined' ? window.renderTooltip({
                what: { de: 'Mindestanzahl', en: 'Minimum Count' },
                why: { de: 'Legt die minimale Anzahl der Zeichen fest', en: 'Sets the minimum number of characters' },
                how: { de: 'Verwendet {n,} Quantifier', en: 'Uses {n,} quantifier' },

            </label>
            <div class="selector-list" style="margin-bottom: var(--space-2);">
              <button class="selector-text-btn ${minMode === 'exact' ? 'active' : ''}" data-min-mode="exact" type="button">
                ${this.t('exactly') || 'Genau'}
              </button>
              <button class="selector-text-btn ${minMode === 'upTo' ? 'active' : ''}" data-min-mode="upTo" type="button">

            </div>
            <input type="number" class="form-input manual-input" id="cfg-min" value="${cfg.min || 1}" min="0">
          </div>
          <div class="form-group" id="max-group" style="${quantifierMode !== 'custom' || minMode === 'exact' ? 'display: none;' : ''}">
            <label class="form-label">
              ${this.t('max')}
              ${typeof window.renderTooltip !== 'undefined' ? window.renderTooltip({
                what: { de: 'Maximalanzahl', en: 'Maximum Count' },
                why: { de: 'Legt die maximale Anzahl der Zeichen fest', en: 'Sets the maximum number of characters' },
                how: { de: 'Verwendet {n,m} Quantifier', en: 'Uses {n,m} quantifier' },
                impact: { de: 'Pattern matcht nur bis zu dieser Anzahl', en: 'Pattern matches only up to this count' }
              }) : ''}
            </label>
            <input type="number" class="form-input manual-input" id="cfg-max" value="${cfg.max || ''}" min="0">
          </div>
          ${pt === 'mixed' ? `
          <div class="form-group">
            <label class="form-label">
              ${t('Zusätzliche Zeichen:', 'Extra characters:')}
              ${typeof window.renderTooltip !== 'undefined' ? window.renderTooltip({
                what: { de: 'Zusätzliche Zeichen', en: 'Extra Characters' },
                why: { de: 'Erlaubt zusätzliche Sonderzeichen neben Buchstaben und Zahlen', en: 'Allows additional special characters besides letters and numbers' },
                how: { de: 'Wird zu den erlaubten Zeichen hinzugefügt', en: 'Added to allowed characters' },
                impact: { de: 'Erweitert die erlaubten Zeichen um diese Sonderzeichen', en: 'Extends allowed characters with these special characters' }
              }) : ''}
            </label>
            <input type="text" class="form-input manual-input" id="cfg-extra" value="${cfg.extraChars || '.,:/€$'}" placeholder="${t('z.B. .,:/€$', 'e.g. .,:/€$')}">
          </div>
          ` : ''}
          `);
      }
      
      // Einheitliche Groß-/Kleinschreibung für letters und mixed
      if (['letters', 'mixed'].includes(pt)) {
        htmlParts.push(`
          <div class="form-group">
            <label class="form-label">
              ${t('Groß-/Kleinschreibung:', 'Case sensitivity:')}
              ${typeof window.renderTooltip !== 'undefined' ? window.renderTooltip({
                what: { de: 'Groß-/Kleinschreibung', en: 'Case Sensitivity' },
                why: { de: 'Bestimmt, welche Buchstabenarten erlaubt sind', en: 'Determines which letter types are allowed' },
                how: { de: 'Beides: A-Z und a-z, Nur Großschrift: A-Z, Nur Kleinschrift: a-z', en: 'Both: A-Z and a-z, Uppercase only: A-Z, Lowercase only: a-z' },
                impact: { de: 'Beeinflusst die erlaubten Buchstaben im Pattern', en: 'Affects allowed letters in pattern' }
              }) : ''}
            </label>
            <div class="selector-list">
              <button class="selector-text-btn ${cfg.caseMode === 'any' || !cfg.caseMode ? 'active' : ''}" data-case-mode="any" type="button" style="white-space: normal; line-height: 1.3;">
                ${this.t('case_any')}
              </button>
              <button class="selector-text-btn ${cfg.caseMode === 'upper' ? 'active' : ''}" data-case-mode="upper" type="button" style="white-space: normal; line-height: 1.3;">
                ${lang === 'de' ? 'Nur<br>Großschreibung' : 'Uppercase<br>only'}
              </button>
              <button class="selector-text-btn ${cfg.caseMode === 'lower' ? 'active' : ''}" data-case-mode="lower" type="button" style="white-space: normal; line-height: 1.3;">
                ${lang === 'de' ? 'Nur<br>Kleinschreibung' : 'Lowercase<br>only'}
              </button>
            </div>
          </div>
        `);
      }
      
      if (['numbers', 'letters', 'mixed'].includes(pt)) {
        htmlParts.push(`
          <div class="form-group">
            <label class="form-label">
              ${this.t('whitelist')}
              ${typeof window.renderTooltip !== 'undefined' ? window.renderTooltip({
                what: { de: 'Whitelist', en: 'Whitelist' },
                why: { de: 'Nur diese Zeichen werden erlaubt', en: 'Only these characters are allowed' },
                how: { de: 'Erstellt positive Character Class [abc]. Wichtig: Die Whitelist ersetzt das Basis-Pattern (z.B. [0-9]), nicht ergänzt es.', en: 'Creates positive character class [abc]. Important: The whitelist replaces the base pattern (e.g. [0-9]), it does not supplement it.' },
                impact: { de: 'Beschränkt die erlaubten Zeichen. Beispiel: Bei Zahlen mit Whitelist [1,2] wird [0-9] durch [12] ersetzt.', en: 'Restricts allowed characters. Example: For numbers with whitelist [1,2], [0-9] is replaced by [12].' }
              }) : ''}
            </label>
            <div class="part-hint" style="margin-bottom: var(--space-2); font-size: var(--font-sm); color: var(--text-secondary);">
              ${t('Wichtig: Geben Sie jeden Begriff zeilenweise ein. "12" (eine Zeile) wird anders behandelt als "1" und "2" (zwei Zeilen).', 'Important: Enter each term on a separate line. "12" (one line) is treated differently than "1" and "2" (two lines).')}
            </div>
            <textarea class="form-textarea manual-input" id="cfg-whitelist" style="min-height: 100px;" placeholder="${t('Jeder Begriff in einer eigenen Zeile\nz.B.:\n1\n2\n3', 'Each term on a separate line\ne.g.:\n1\n2\n3')}">${cfg.whitelist?.join('\n') || ''}</textarea>
          </div>
          <div class="form-group">
            <label class="form-label">
              ${this.t('blacklist')}
              ${typeof window.renderTooltip !== 'undefined' ? window.renderTooltip({
                what: { de: 'Blacklist', en: 'Blacklist' },
                why: { de: 'Diese Zeichen werden ausgeschlossen', en: 'These characters are excluded' },
                how: { de: 'Erstellt negative Character Class [^abc]. Wichtig: Die Blacklist ersetzt das Basis-Pattern (z.B. [0-9]), nicht ergänzt es.', en: 'Creates negative character class [^abc]. Important: The blacklist replaces the base pattern (e.g. [0-9]), it does not supplement it.' },
                impact: { de: 'Verhindert bestimmte Zeichen. Beispiel: Bei Zahlen mit Blacklist [4,5] wird [0-9] durch [^45] ersetzt.', en: 'Prevents specific characters. Example: For numbers with blacklist [4,5], [0-9] is replaced by [^45].' }
              }) : ''}
            </label>
            <div class="part-hint" style="margin-bottom: var(--space-2); font-size: var(--font-sm); color: var(--text-secondary);">
              ${t('Wichtig: Geben Sie jeden Begriff zeilenweise ein. "12" (eine Zeile) wird anders behandelt als "1" und "2" (zwei Zeilen).', 'Important: Enter each term on a separate line. "12" (one line) is treated differently than "1" and "2" (two lines).')}
            </div>
            <textarea class="form-textarea manual-input" id="cfg-blacklist" style="min-height: 100px;" placeholder="${t('Jeder Begriff in einer eigenen Zeile\nz.B.:\n1\n2\n3', 'Each term on a separate line\ne.g.:\n1\n2\n3')}">${cfg.blacklist?.join('\n') || ''}</textarea>
          </div>
        `);
      }

      // 🔹 Optional-Checkbox für alle Part-Typen
      htmlParts.push(`
        <div class="form-group">
          <label class="form-label">
            <input type="checkbox" id="cfg-optional" ${cfg.isOptional ? 'checked' : ''} style="margin-right: var(--space-2);">
            ${this.t('isOptional') || 'Optional'}
            ${typeof window.renderTooltip !== 'undefined' ? window.renderTooltip({
              what: { de: 'Optional', en: 'Optional' },
              why: { de: 'Dieser Baustein kann vorhanden sein oder nicht. Wenn optional aktiviert ist, wird das Pattern auch dann gematcht, wenn dieser Teil fehlt.', en: 'This part can be present or not. If optional is enabled, the pattern will match even if this part is missing.' },
              how: { de: 'Verwendet (?:pattern)? Quantifier. Beispiel: "ABC" matched sowohl "ABC" als auch "AB" (wenn C optional ist).', en: 'Uses (?:pattern)? quantifier. Example: "ABC" matches both "ABC" and "AB" (if C is optional).' },
              impact: { de: 'Pattern matched auch ohne diesen Teil. Beispiel: Wenn "Titel" optional ist, matched "Herr Mustermann" auch ohne "Dr.".', en: 'Pattern matches even without this part. Example: If "title" is optional, "Mr. Smith" matches even without "Dr.".', }
            }) : ''}
          </label>
        </div>
      `);

      // 🔹 Testfeld für diesen Part
      htmlParts.push(`
        <div class="part-test" aria-live="polite">
          <label class="form-label">
            ${t('Test nur für dieses Teil', 'Test for this part only')} <span style="font-size: var(--font-xs); color: var(--text-secondary); font-weight: normal;">(${t('bei Änderung der Parameter bitte immer neue Daten eingeben', 'please always enter new data when changing parameters')})</span>
            ${typeof window.renderTooltip !== 'undefined' ? window.renderTooltip({
              what: { de: 'Einzeltest', en: 'Single Part Test' },
              why: { de: 'Testet nur diesen Baustein isoliert, nicht das gesamte Pattern', en: 'Tests only this part in isolation, not the entire pattern' },
              how: { de: 'Geben Sie einen Testwert ein und sehen Sie, ob dieser Baustein ihn matched', en: 'Enter a test value and see if this part matches it' },
              impact: { de: 'Hilft bei der Fehlersuche und Verifizierung einzelner Bausteine', en: 'Helps debugging and verifying individual parts' }
            }) : ''}
          </label>
          <input type="text" id="part-test-input" class="form-input" placeholder="${t('Wert eingeben', 'Enter value')}">
          <div id="part-test-preview" class="preview-output"></div>
        </div>
      `);

      // Debug-Output entfernt (nicht für Endbenutzer sichtbar)

      const preview = this.partPreview?.(this.state.newPart);
      if (preview) {
        htmlParts.push(`
          <div class="part-preview">
            <strong>${APP.t('previewLabel')}:</strong> ${this.esc(preview)}
          </div>
        `);
      }

      return htmlParts.join('');
    },
    // Collapsible-Komponente rendern
    renderCollapsible: function(title, content, options = {}) {
      const id = options.id || 'collapse-' + Math.random().toString(36).slice(2, 8);
      const openAttr = options.open ? ' open' : '';
      return (
        '<details class="collapsible"' + openAttr + ' id="' + id + '">' +
          '<summary class="collapsible-title">' + title + '</summary>' +
          '<div class="collapsible-content">' + content + '</div>' +
        '</details>'
      );
    },
    // Regex-Erklärungsbox rendern
    renderRegexExplanation: function() {
      const t = this.t.bind(this);
      const items = [
        { code: '/.../', key: 'delimiters' },
        { code: 'g', key: 'global' },
        { code: 'm', key: 'multiline' },
        { code: '^', key: 'start' },
        { code: '$', key: 'end' },
        { code: '(?: ... )', key: 'whitelist' },
        { code: '(?! ... )', key: 'blacklist' }
      ];
      return (
        '<ul>' +
          items.map(item => '<li><code>' + item.code + '</code> – ' + t('regex_' + item.key) + '</li>').join('') +
        '</ul>'
      );
    },
    // Testfeld rendern
    renderRegexTestField: function() {
      const t = this.t.bind(this);
      const testText = this.state.testText || '';
      const fullLine = this.state.fullLine;
      const regex = this.genPattern();

      let matches = [];
      try {
        matches = testText.match(regex) || [];
      } catch (e) {
        matches = [];
      }

      this.state.matches = matches;

      // 🔹 Highlighting
      let highlighted = this.esc(testText);
      if (matches.length > 0) {
        matches.forEach(m => {
          const matchStr = typeof m === 'string' ? m : (Array.isArray(m) ? m[0] : null);
          if (typeof matchStr === 'string' && matchStr.length < 10000) {
            try {
              const escMatch = this.esc(matchStr);
              const regex = new RegExp(this.escRegex(matchStr), 'g');
              highlighted = highlighted.replace(regex, '<mark>' + escMatch + '</mark>');
            } catch (e) {
            }
          }
        });
      }
      // 🔹 Rückgabe
      return (
        '<div class="form-group">' +
          '<label for="test-txt">' + t('testText') + '</label>' +
          '<textarea id="test-txt" class="form-textarea" aria-label="' + t('testText') + '" rows="4">' +
            this.esc(testText) +
          '</textarea>' +
        '</div>' +
        '<div class="form-group">' +
          '<label><input type="checkbox" id="full-line-toggle" ' + (fullLine ? 'checked' : '') + '> ' +
            t('fullLineToggle') + '</label>' +
        '</div>' +
        '<div class="live-preview-test">' + highlighted + '</div>' +
        (matches.length > 0
          ? '<div class="alert alert-success">✔ ' + matches.length + ' ' + t('matches') + '</div>'
          : (testText ? '<div class="alert alert-error">✗ ' + t('noMatches') + '</div>' : '')
        )
      );
    },
    // Flag-Legende rendern
    renderFlagLegend: function(flags) {
      if (!flags || typeof flags !== 'string') return '';
      
      const lang = this.state.lang;
      const t = (de, en) => lang === 'de' ? de : en;

      const legend = {
        g: t('Alle Treffer finden (global)', 'Find all matches (global)'),
        m: t('Mehrzeilig: ^/$ pro Zeile', 'Multiline: ^/$ per line'),
        i: t('Groß-/Kleinschreibung ignorieren', 'Ignore case sensitivity'),
        u: t('Unicode-Modus: Emojis, Umlaute korrekt behandeln', 'Unicode mode: handles emojis and accents'),
        s: t('DotAll: Punkt (.) matched auch Zeilenumbrüche', 'DotAll: dot (.) matches line breaks')
      };

      let html = '<div class="flag-legend">';
      html += '<span class="legend-label">🔧 ' + t('Flags:', 'Flags:') + '</span>';

      flags.split('').forEach(f => {
        if (legend[f]) {
          html += '<span class="flag-icon" title="' + this.esc(legend[f]) + '">' + f + '</span>';
        }
      });

      html += '</div>';
      return html;
    },
    // Flag-Zusammenfassung rendern
    renderFlagSummary: function() {
      const lang = this.state.lang;
      const t = (de, en) => lang === 'de' ? de : en;

      const flags = this.state.flags;

      const summary = [];

      if (flags.global) summary.push(t('g = global: alle Treffer finden', 'g = global: find all matches'));
      if (flags.multiline) summary.push(t('m = mehrzeilig: ^/$ pro Zeile', 'm = multiline: ^/$ per line'));
      if (flags.unicode) summary.push(t('u = Unicode-Modus: Emojis, Umlaute korrekt behandeln', 'u = Unicode mode: handles emojis and accents'));
      if (flags.ignoreCase) summary.push(t('i = Case-insensitive: Groß-/Kleinschreibung ignorieren', 'i = Case-insensitive: ignore case'));
      if (flags.dotAll) summary.push(t('s = DotAll: Punkt (.) matched auch Zeilenumbrüche', 's = DotAll: dot (.) matches line breaks'));

      return (
        '<div class="flag-summary">' +
          '<div class="info-box-title">🔧 ' + t('Aktive Flags', 'Active Flags') + '</div>' +
          '<ul style="margin-left:16px">' +
            summary.map(s => '<li>' + s + '</li>').join('') +
          '</ul>' +
        '</div>'
      );
    },
    //
    renderBreadcrumb: function(pathArray) {
      const t = this.t.bind(this);

      const items = pathArray.map((item, i) => {
        const isLast = i === pathArray.length - 1;
        // Mapping für Übersetzungen
        const labelMap = {
          'home': t('breadcrumb_home') || 'Start',
          'templates': t('breadcrumb_templates') || 'Vorlagen',
          'builder': t('breadcrumb_builder') || 'Builder',
          'analyzer': t('breadcrumb_analyzer') || 'Analyzer'
        };
        const label = labelMap[item] || t(item) || item;

        if (isLast) {
          return `<li class="breadcrumb-item active" aria-current="page">${label}</li>`;
        } else {
          return `
            <li class="breadcrumb-item">
              <a href="#" data-nav="${item}">${label}</a>
              <span class="breadcrumb-separator" aria-hidden="true">›</span>
            </li>
          `;
        }
      }).join('');

      return `<nav class="breadcrumb" aria-label="Breadcrumb"><ol>${items}</ol></nav>`;
    },
    // View-Renderer
    renderView: function(view) {
      switch (view) {
        case 'welcome':
          return this.renderWelcomeView();
        case 'templates':
          return this.renderTemplates();
        case 'wizard':
        case 'builder':
          return this.renderBuilder();
        case 'analyzer':
          return this.renderAnalyzerView();
        default:
          return '<p>Unbekannter View: ' + view + '</p>';
      }
    },
    // Gesamtrender-Funktion
    render: function() {
      switch (this.state.view) {
        case 'welcome':
          this.renderWelcomeView();
          break;
        case 'templates':  // ← Plural verwenden!
          const appEl = document.getElementById('app-container').innerHTML = this.renderTemplates();
          this.attachTemplateEvents();
          break;
        case 'builder':
          this.renderBuilderView();
          break;
        case 'analyzer':
          this.renderAnalyzerView();
          break;
        default:
          break;
      }
      this.initUI();
      this.attachGlobalEvents?.();
      this.attachWelcomeEvents?.();
      this.attachTemplateEvents?.();
      this.attachBuilderEvents?.();
      this.attachAnalyzerEvents?.();
      // Snippet-Modal rendern wenn adding=true
      if (this.state.adding) {
        this.renderSnippetModal();
      }
    },
    // Snippet-Builder Modal rendern und öffnen
    renderSnippetModal: function() {
      const t = this.t.bind(this);
      const modal = document.getElementById('snippet-modal');
      const titleEl = document.getElementById('snippet-modal-title');
      const bodyEl = document.getElementById('snippet-modal-body');
      const cancelBtn = document.getElementById('snippet-cancel');
      const confirmBtn = document.getElementById('snippet-confirm');
      
      if (!modal || !titleEl || !bodyEl || !cancelBtn || !confirmBtn) return;
      
      // Titel mit Baustein/Vorlage-Namen
      let titleText = t('addPart') || 'Baustein hinzufügen';
      if (this.state.partType) {
        // Baustein-Typ gewählt - zeige Namen
        const pt = this.partTypes?.find(p => p.id === this.state.partType);
        if (pt) {
          const lang = this.lang();
          const ptName = typeof pt.name === 'object' ? (pt.name[lang] || pt.name.de || pt.id) : (pt.name || pt.id);
          titleText += ' - ' + ptName;
        }
      } else if (this.state.selectedTemplate) {
        // Template gewählt - zeige Namen
        const tpl = this.builderTemplates?.[this.state.selectedTemplate];
        if (tpl) {
          const lang = this.lang();
          const tplName = typeof tpl.name === 'object' ? (tpl.name[lang] || tpl.name.de || tpl.id) : (tpl.name || tpl.id);
          titleText += ' - ' + tplName;
        }
      }
      
      titleEl.textContent = titleText;
      cancelBtn.textContent = t('cancel') || 'Abbrechen';
      
      let bodyHtml = '';
      
      // Step-Guide für Modal hinzufügen
      bodyHtml += this.renderStepGuide(true);
      
      // Step-basierte Anzeige
      const currentStep = this.state.step || (!this.state.partType ? 'type' : 'config');
      
      if (currentStep === 'type' || !this.state.partType) {
        // Step 1: Baustein-Typ wählen
        this.state.step = 'type'; // Sicherstellen, dass Step korrekt gesetzt ist
        bodyHtml += `<div class="card">`;
        bodyHtml += `<div class="card-title">🧩 ${t('selectPartType') || 'Baustein-Typ wählen'}</div>`;
        bodyHtml += `<div class="card-description">${t('selectPartTypeDesc') || 'Wählen Sie den Typ des Bausteins, den Sie hinzufügen möchten'}</div>`;
        bodyHtml += `<div class="part-type-selector">${this.renderPartTypeButtons()}</div>`;
        bodyHtml += `</div>`;
        
        confirmBtn.style.display = 'none';
      } else if (currentStep === 'config') {
        // Step 2: Konfiguration
        this.state.step = 'config'; // Sicherstellen, dass Step korrekt gesetzt ist
        bodyHtml += `<div class="card">`;
        bodyHtml += `<div class="card-title">🔧 ${t('configurePart') || 'Baustein konfigurieren'}</div>`;
        bodyHtml += `<div class="card-description">${t('configurePartDesc') || 'Passen Sie die Eigenschaften dieses Bausteins an'}</div>`;
        bodyHtml += this.renderConfig();
        
        // RegEx-Pattern-Vorschau auch im Config-Step zeigen
        const partPreview = this.buildRegexForCurrentPart?.();
        if (partPreview && partPreview.source) {
          bodyHtml += `<div class="form-group" style="margin-top: var(--space-3); border-top: 1px solid var(--border); padding-top: var(--space-3);">`;

        bodyHtml += `<div class="card-description">${t('positionSelectorDesc', 'Wählen Sie, wo der nächste Teil eingefügt wird')}</div>`;

      } else if (currentStep === 'preview') {
        // Step 4: Preview & Test
        this.state.step = 'preview';
        bodyHtml += `<div class="card">`;

        const partPreview = this.buildRegexForCurrentPart?.();
        if (partPreview) {
          bodyHtml += `<div class="live-preview">`;
          bodyHtml += `<div class="form-group">`;
          bodyHtml += `<label class="form-label">🔧 ${t('regexPattern', 'RegEx-Pattern')} <span style="font-size: var(--font-xs); color: var(--text-secondary); font-weight: normal;">(${t('advancedEdit', 'Erweitert: direkt bearbeitbar')})</span></label>`;
          bodyHtml += `<input type="text" id="regex-editor-input" class="form-input manual-input" value="${this.esc(partPreview.source || '')}" style="font-family: monospace; font-size: var(--font-sm);">`;
          bodyHtml += `<div class="regex-preview" tabindex="0" role="button" aria-label="${t('copyPatternLabel') || 'Pattern kopieren'}">`;
          bodyHtml += `<code id="snippet-preview-code">${this.esc(partPreview.source || '// ungültig')}</code>`;
          bodyHtml += `<span id="copy-feedback-snippet"></span>`;
          bodyHtml += `</div>`;
          bodyHtml += `</div>`;
          bodyHtml += `<div class="form-group" style="margin-top: var(--space-3);">`;
          bodyHtml += `<label class="form-label">${t('testTextLabel') || t('testText', 'Test-Text:')}</label>`;
          bodyHtml += `<input type="text" id="snippet-test-input" class="form-input" placeholder="${t('testTextPlaceholder') || t('Text zum Testen eingeben', 'Enter text to test')}">`;
          bodyHtml += `<div id="snippet-test-result" style="margin-top: var(--space-2); padding: var(--space-2); background: var(--bg-secondary); border-radius: var(--radius-1); font-size: var(--font-sm);"></div>`;
          bodyHtml += `</div>`;
          bodyHtml += `</div>`;
        } else {
          bodyHtml += `<div class="info-box info-box-warning">${t('noPreviewAvailable') || 'Vorschau nicht verfügbar'}</div>`;
        }
        bodyHtml += `</div>`;
        
        // Bestätigen Button immer sichtbar machen
        confirmBtn.style.display = '';
        confirmBtn.textContent = this.state.selectedPartIndex !== undefined ? (t('save') || 'Speichern') : (t('add') || 'Hinzufügen');
      } else {
        // Für alle anderen Steps: Button ausblenden
        confirmBtn.style.display = 'none';
      }
      
      bodyEl.innerHTML = bodyHtml;
      modal.classList.add('active');
      
      // Focus-Trap aktivieren
      setTimeout(() => {
        this.setupModalFocusTrap(modal);
      }, 150);
      
      // Event-Handler nach Rendern aktivieren - nur einmal binden
      if (!modal.dataset.eventsBound) {
        setTimeout(() => {
          this.attachSnippetModalEvents();
          this.bindStepClicks(); // Step-Navigation auch im Modal binden
          modal.dataset.eventsBound = '1';
        }, 50);
      } else {
        // Events bereits gebunden, nur aktualisieren
        setTimeout(() => {
          this.attachSnippetModalEvents();
          this.bindStepClicks(); // Step-Navigation aktualisieren
        }, 50);
      }
      
      // Active-States für Baustein/Vorlagen aktualisieren
      setTimeout(() => {
        const app = document.getElementById('app-container');
        if (app) {
          // Active-State für Template-Buttons aktualisieren
          app.querySelectorAll('[data-tpl]').forEach(btn => {
            const key = btn.getAttribute('data-tpl');
            btn.classList.toggle('active', this.state.selectedTemplate === key);
          });
          // Active-State für Baustein-Buttons aktualisieren
          app.querySelectorAll('[data-type]').forEach(btn => {
            const kind = btn.getAttribute('data-type');
            btn.classList.toggle('active', this.state.partType === kind && !this.state.selectedTemplate);
          });
        }
      }, 100);
    },
    // Snippet-Modal schließen
    closeSnippetModal: function() {
      const modal = document.getElementById('snippet-modal');
      if (modal) {
        modal.classList.remove('active');
      }
      this.state.adding = false;
      this.state.validationError = '';
      this.state.step = 'type'; // Reset Step beim Schließen
      this.state.partType = null;
      this.state.partConfig = null;
      
      // Focus-Trap entfernen
      const trapHandler = modal.dataset.trapHandler;
      if (trapHandler) {
        modal.removeEventListener('keydown', window[trapHandler]);
        delete window[trapHandler];
        delete modal.dataset.trapHandler;
      }
    },
    // Focus-Trap für Modal aktivieren
    setupModalFocusTrap: function(modal) {
      if (!modal) return;
      
      // Focusable Elemente im Modal finden
      const getFocusableElements = (container) => {
        const focusableSelectors = [
          'button:not([disabled])',
          'input:not([disabled])',
          'textarea:not([disabled])',
          'select:not([disabled])',
          'a[href]',
          '[tabindex]:not([tabindex="-1"])'
        ];
        return Array.from(container.querySelectorAll(focusableSelectors.join(', ')))
          .filter(el => {
            const style = window.getComputedStyle(el);
            return style.display !== 'none' && style.visibility !== 'hidden';
          });
      };
      
      // Trap-Handler erstellen
      const trapHandler = (e) => {
        if (e.key !== 'Tab') return;
        
        const focusableElements = getFocusableElements(modal);
        if (focusableElements.length === 0) return;
        
        const firstElement = focusableElements[0];
        const lastElement = focusableElements[focusableElements.length - 1];
        
        if (e.shiftKey) {
          // Shift+Tab: Rückwärts
          if (document.activeElement === firstElement) {
            e.preventDefault();
            lastElement.focus();
          }
        } else {
          // Tab: Vorwärts
          if (document.activeElement === lastElement) {
            e.preventDefault();
            firstElement.focus();
          }
        }
      };
      
      // Handler speichern
      const handlerName = 'modalFocusTrap_' + Date.now();
      window[handlerName] = trapHandler;
      modal.dataset.trapHandler = handlerName;
      
      // Event-Listener hinzufügen
      modal.addEventListener('keydown', trapHandler);
      
      // Focus auf erstes Element setzen
      setTimeout(() => {
        const focusableElements = getFocusableElements(modal);
        if (focusableElements.length > 0) {
          focusableElements[0].focus();
        }
      }, 100);
    },
    // Event-Handler für Snippet-Modal aktivieren
    attachSnippetModalEvents: function() {
      const self = this;
      const modal = document.getElementById('snippet-modal');
      if (!modal) return;
      
      // Alte Event-Listener entfernen (falls vorhanden)
      const oldPreview = modal.querySelector('.regex-preview');
      if (oldPreview) {
        oldPreview.replaceWith(oldPreview.cloneNode(true));
      }
      
      // Copy-Button für Preview
      const previewEl = modal.querySelector('.regex-preview');
      if (previewEl) {
        previewEl.addEventListener('click', function(e) {
          e.stopPropagation();
          const codeEl = previewEl.querySelector('code');
          if (codeEl) {
            const text = codeEl.textContent || '';
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(() => {
                const feedback = modal.querySelector('#copy-feedback-snippet');
                if (feedback) {
                  feedback.textContent = ' ✓';
                  feedback.style.color = 'var(--success)';
                  setTimeout(() => {
                    feedback.textContent = '';
                  }, 2000);
                }
              }).catch(err => {
              });
            } else {
              // Fallback für ältere Browser
              const ta = document.createElement('textarea');
              ta.value = text;
              ta.style.position = 'fixed';
              ta.style.left = '-9999px';
              document.body.appendChild(ta);
              ta.select();
              try {
                document.execCommand('copy');
                const feedback = modal.querySelector('#copy-feedback-snippet');
                if (feedback) {
                  feedback.textContent = ' ✓';
                  feedback.style.color = 'var(--success)';
                  setTimeout(() => {
                    feedback.textContent = '';
                  }, 2000);
                }
              } catch (err) {
              }
              document.body.removeChild(ta);
            }
          }
        });
      }
      
      // Baustein-Typ Buttons im Modal aktivieren - Delegation verwenden
      modal.addEventListener('click', function(e) {
        const typeBtn = e.target.closest('[data-type]');
        if (typeBtn) {
          e.preventDefault();
          e.stopPropagation();
          const kind = typeBtn.getAttribute('data-type');
          self.state.partType = kind;
          if (typeof self.makePart === 'function') {
            self.state.partConfig = self.makePart(kind);
          }
          self.state.step = 'config'; // Wechsel zu Config-Step
          self.renderSnippetModal(); // Re-render mit Konfiguration
        }
      });
      
      // Funktion zum Aktualisieren der Live-Vorschau
      const updatePreview = function() {
        // Prüfen ob RegEx manuell editiert wurde
        const regexEditorInput = modal.querySelector('#regex-editor-input');
        const manualRegex = regexEditorInput ? regexEditorInput.value.trim() : null;
        
        let partPreview;
        if (manualRegex && regexEditorInput && regexEditorInput.value !== regexEditorInput.dataset.originalValue) {
          // Manuelles RegEx wurde geändert - verwende dieses
          try {
            // Validierung: Versuche RegEx zu erstellen
            new RegExp(manualRegex);
            partPreview = { source: manualRegex, flags: '' };
          } catch (e) {
            // Ungültiges RegEx - verwende generiertes
            partPreview = self.buildRegexForCurrentPart?.();
          }
        } else {
          // Normales generiertes RegEx verwenden
          partPreview = self.buildRegexForCurrentPart?.();
        }
        
        // RegEx-Vorschau im Config-Step aktualisieren
        const configStepCard = modal.querySelector('.card');
        if (configStepCard && self.state.step === 'config') {
          const configPreviewCode = configStepCard.querySelector('.regex-preview code');
          if (configPreviewCode && partPreview) {
            configPreviewCode.textContent = partPreview.source || '// ungültig';
          }
        }
        
        const previewCode = modal.querySelector('#snippet-preview-code');
        if (previewCode && partPreview) {
          previewCode.textContent = partPreview.source || '// ungültig';
        }
        
        // RegEx-Editor Input aktualisieren falls nicht manuell geändert
        if (regexEditorInput && (!manualRegex || regexEditorInput.value === regexEditorInput.dataset.originalValue)) {
          regexEditorInput.value = partPreview?.source || '';
          regexEditorInput.dataset.originalValue = partPreview?.source || '';
        }
        
        // Testbereich aktualisieren
        const testInput = modal.querySelector('#snippet-test-input');
        const testResult = modal.querySelector('#snippet-test-result');
        if (testInput && testResult && partPreview) {
          const testText = testInput.value;
          if (testText) {
            try {
              const regex = new RegExp(partPreview.source, partPreview.flags || '');
              const matches = testText.match(regex);
              const lang = self.lang();
              const t = (de, en) => lang === 'de' ? de : en;
              if (matches) {
                testResult.innerHTML = `<strong style="color: var(--success);">✓ ${self.t('matchFound') || (lang === 'de' ? 'Match gefunden:' : 'Match found:')}</strong><br>${self.esc(matches[0])}`;
              } else {
                testResult.innerHTML = `<strong style="color: var(--text-secondary);">✗ ${self.t('noMatch') || (lang === 'de' ? 'Kein Match' : 'No Match')}</strong>`;
              }
            } catch (err) {
              const lang = self.lang();
              const t = (de, en) => lang === 'de' ? de : en;
              testResult.innerHTML = `<strong style="color: var(--error);">⚠ ${self.t('invalidPattern') || (lang === 'de' ? 'Ungültiges Pattern' : 'Invalid Pattern')}</strong>`;
            }
          } else {
            testResult.innerHTML = '';
          }
        }
      };
      
      // Initial: Original-Wert für RegEx-Editor setzen
      const regexEditorInput = modal.querySelector('#regex-editor-input');
      if (regexEditorInput) {
        const partPreview = self.buildRegexForCurrentPart?.();
        if (partPreview) {
          regexEditorInput.dataset.originalValue = partPreview.source || '';
        }
        regexEditorInput.addEventListener('input', function() {
          setTimeout(updatePreview, 100);
        });
      }
      
      // Config-Inputs live aktualisieren - Delegation verwenden
      modal.addEventListener('input', function(e) {
        if (e.target.matches('input, select, textarea')) {
          setTimeout(updatePreview, 100);
          // Auch Part-Test aktualisieren wenn sich Config ändert
          const partTestInput = modal.querySelector('#part-test-input');
          const partTestPreview = modal.querySelector('#part-test-preview');
          if (partTestInput && partTestPreview && partTestInput.value && self.testPart) {
            setTimeout(() => {
              const val = partTestInput.value;
              if (val) {
                const currentConfig = self.readConfig ? self.readConfig() : (self.state.partConfig || {});
                const ok = self.testPart(self.state.partType, currentConfig, val);
                const lang = self.state.lang || 'de';
                partTestPreview.textContent = ok
                  ? (lang === 'de' ? '✔ gültig' : '✔ valid')
                  : (lang === 'de' ? '✗ ungültig' : '✗ invalid');
                partTestPreview.style.color = ok ? 'var(--success)' : 'var(--error)';
              }
            }, 100);
          }
        }
      });
      
      modal.addEventListener('change', function(e) {
        if (e.target.matches('input, select, textarea')) {
          setTimeout(updatePreview, 100);
          // Auch Part-Test aktualisieren wenn sich Config ändert
          const partTestInput = modal.querySelector('#part-test-input');
          const partTestPreview = modal.querySelector('#part-test-preview');
          if (partTestInput && partTestPreview && partTestInput.value && self.testPart) {
            setTimeout(() => {
              const val = partTestInput.value;
              if (val) {
                const currentConfig = self.readConfig ? self.readConfig() : (self.state.partConfig || {});
                const ok = self.testPart(self.state.partType, currentConfig, val);
                const lang = self.state.lang || 'de';
                partTestPreview.textContent = ok
                  ? (lang === 'de' ? '✔ gültig' : '✔ valid')
                  : (lang === 'de' ? '✗ ungültig' : '✗ invalid');
                partTestPreview.style.color = ok ? 'var(--success)' : 'var(--error)';
              }
            }, 100);
          }
        }
      });
      
      // Prüfmodus Buttons (data-mode) für numbers, letters, mixed, special im Modal
      modal.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const mode = this.getAttribute('data-mode');
          
          // Alle Buttons in derselben Gruppe deaktivieren
          const group = this.closest('.selector-list');
          if (group) {
            group.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
          }
          this.classList.add('active');
          
          // Config aktualisieren
          if (!self.state.partConfig) self.state.partConfig = {};
          self.state.partConfig.mode = mode;
          
          // Live-Preview aktualisieren
          updatePreview();
        });
      });
      
      // Quantifier-Mode Buttons (data-quantifier-mode) für numbers, letters, mixed, special im Modal
      modal.querySelectorAll('[data-quantifier-mode]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const mode = this.getAttribute('data-quantifier-mode');
          
          // Alle Buttons in derselben Gruppe deaktivieren
          const group = this.closest('.selector-list');
          if (group) {
            group.querySelectorAll('[data-quantifier-mode]').forEach(b => b.classList.remove('active'));
          }
          this.classList.add('active');
          
          // Config aktualisieren
          if (!self.state.partConfig) self.state.partConfig = {};
          self.state.partConfig.quantifierMode = mode;
          
          // Custom-Gruppe ein-/ausblenden
          const customGroup = modal.querySelector('#quantifier-custom-group');
          if (customGroup) {
            customGroup.style.display = mode === 'custom' ? '' : 'none';
          }
          
          // Max-Gruppe ein-/ausblenden (nur wenn custom und upTo)
          const maxGroup = modal.querySelector('#max-group');
          if (maxGroup && mode === 'custom') {
            const minModeBtn = modal.querySelector('[data-min-mode].active');
            const minMode = minModeBtn ? minModeBtn.getAttribute('data-min-mode') : 'upTo';
            maxGroup.style.display = minMode === 'exact' ? 'none' : '';
          } else if (maxGroup) {
            maxGroup.style.display = 'none';
          }
          
          // Live-Preview aktualisieren
          updatePreview();
        });
      });
      
      // Min-Mode Buttons (data-min-mode) für numbers, letters, mixed, special im Modal
      modal.querySelectorAll('[data-min-mode]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const mode = this.getAttribute('data-min-mode');
          
          // Alle Buttons in derselben Gruppe deaktivieren
          const group = this.closest('.selector-list');
          if (group) {
            group.querySelectorAll('[data-min-mode]').forEach(b => b.classList.remove('active'));
          }
          this.classList.add('active');
          
          // Config aktualisieren
          if (!self.state.partConfig) self.state.partConfig = {};
          self.state.partConfig.minMode = mode;
          
          // Max-Gruppe ein-/ausblenden
          const maxGroup = modal.querySelector('#max-group');
          if (maxGroup) {
            maxGroup.style.display = mode === 'exact' ? 'none' : '';
          }
          
          // Wenn "Genau" gewählt wird, max auf min setzen
          if (mode === 'exact') {
            const minInput = modal.querySelector('#cfg-min');
            const maxInput = modal.querySelector('#cfg-max');
            if (minInput && maxInput) {
              maxInput.value = minInput.value;
            }
          }
          
          // Live-Preview aktualisieren
          updatePreview();
        });
      });
      
      // Test-Input aktualisieren
      const testInput = modal.querySelector('#snippet-test-input');
      if (testInput) {
        testInput.addEventListener('input', function() {
          setTimeout(updatePreview, 100);
        });
      }
      
      // Part-Test Input aktivieren (für einzelne Bausteine)
      const partTestInput = modal.querySelector('#part-test-input');
      if (partTestInput) {
        partTestInput.addEventListener('input', function() {
          const val = this.value;
          const preview = modal.querySelector('#part-test-preview');
          if (preview && self.testPart) {
            // Config live aktualisieren, damit Test aktuelle Werte verwendet
            const currentConfig = self.readConfig ? self.readConfig() : (self.state.partConfig || {});
            const ok = self.testPart(self.state.partType, currentConfig, val);
            const lang = self.state.lang || 'de';
            preview.textContent = ok
              ? (lang === 'de' ? '✔ gültig' : '✔ valid')
              : (lang === 'de' ? '✗ ungültig' : '✗ invalid');
            preview.style.color = ok ? 'var(--success)' : 'var(--error)';
          }
        });
      }
      
      // Checkbox-Handler für Whitelist/Blacklist Mode (nur eine aktiv)
      modal.addEventListener('change', function(e) {
        if (e.target.matches('#whitelist-mode-char, #whitelist-mode-term')) {
          // Whitelist: nur eine Checkbox aktiv
          const charBox = modal.querySelector('#whitelist-mode-char');
          const termBox = modal.querySelector('#whitelist-mode-term');
          if (e.target.id === 'whitelist-mode-char' && e.target.checked) {
            if (termBox) termBox.checked = false;
          } else if (e.target.id === 'whitelist-mode-term' && e.target.checked) {
            if (charBox) charBox.checked = false;
          } else if (!charBox.checked && !termBox.checked) {
            // Mindestens eine muss aktiv sein
            e.target.checked = true;
          }
          setTimeout(updatePreview, 100);
        }
        if (e.target.matches('#blacklist-mode-char, #blacklist-mode-term, #blacklist-mode-contains')) {
          // Blacklist: nur eine Checkbox aktiv
          const charBox = modal.querySelector('#blacklist-mode-char');
          const termBox = modal.querySelector('#blacklist-mode-term');
          const containsBox = modal.querySelector('#blacklist-mode-contains');
          if (e.target.checked) {
            if (charBox && e.target !== charBox) charBox.checked = false;
            if (termBox && e.target !== termBox) termBox.checked = false;
            if (containsBox && e.target !== containsBox) containsBox.checked = false;
          } else {
            // Mindestens eine muss aktiv sein
            e.target.checked = true;
          }
          setTimeout(updatePreview, 100);
        }
      });
      
      // Close/Cancel/Confirm Buttons direkt binden
      const closeBtn = modal.querySelector('[data-close-snippet]');
      const cancelBtn = modal.querySelector('#snippet-cancel');
      const confirmBtn = modal.querySelector('#snippet-confirm');
      
      if (closeBtn) {
        closeBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          self.closeSnippetModal();
          self.render();
        });
      }
      
      if (cancelBtn) {
        cancelBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          self.closeSnippetModal();
          self.render();
        });
      }
      
      if (confirmBtn) {
        confirmBtn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const cfg = self.readConfig();
          
          // Prüfen ob RegEx manuell editiert wurde
          const regexEditorInput = modal.querySelector('#regex-editor-input');
          if (regexEditorInput && regexEditorInput.value !== regexEditorInput.dataset.originalValue) {
            const manualRegex = regexEditorInput.value.trim();
            if (manualRegex) {
              try {
                // Validierung: Versuche RegEx zu erstellen
                if (manualRegex.length > 10000) {
                  self.state.validationError = self.t ? (self.t('patternTooLong') || 'Pattern ist zu lang (max. 10000 Zeichen)') : 'Pattern ist zu lang';
                  return false;
                }
                // ReDoS-Schutz: Prüfe auf gefährliche Patterns
                if (/(?:.*\+|.*\*|.*\{.*,.*\})/.test(manualRegex) && /\(/.test(manualRegex)) {
                  // Warnung aber nicht blockieren
                }
                new RegExp(manualRegex);
                // Manuelles RegEx als customPattern speichern
                cfg.customPattern = manualRegex;
              } catch (e) {
                // Ungültiges RegEx - Fehler anzeigen
                self.state.validationError = self.t ? (self.t('invalidPattern') || 'Ungültiges Pattern') : 'Ungültiges Pattern';
                self.showToast(self.t('invalidPattern') || 'Ungültiges Pattern', 'error');
                self.renderSnippetModal();
                return false;
              }
            }
          }
          
          if (!self.validateConfig || !self.validateConfig(self.state.partType, cfg)) {
            // validationError wurde bereits in validateConfig gesetzt
            const errorMsg = self.state.validationError || 
                           self.t('invalidConfig') || 
                           'Konfiguration unvollständig/ungültig';
            self.showToast(errorMsg, 'error');
            self.renderSnippetModal();
            return;
          }
          if (self.state.selectedPartIndex !== undefined) {
            self.state.parts[self.state.selectedPartIndex] = cfg;
            self.state.selectedPartIndex = undefined;
          } else {
            self.state.parts.push(cfg);
          }
          self.state.validationError = '';
          self.markStateAsDirty();
          
          // Erfolgs-Toast anzeigen
          const successMsg = self.i18n?.patternCreatedSuccess?.[self.state.lang] || 
                            self.i18n?.patternCreatedSuccess?.de ||
                            '✓ Pattern erfolgreich erstellt! Sie können es jetzt kopieren.';
          self.showToast(successMsg, 'success');
          
          self.closeSnippetModal();
          self.render();
        });
      }
      
      // Case-Mode Buttons aktivieren (für letters - data-case-mode)
      modal.addEventListener('click', function(e) {
        if (!e.target || typeof e.target.closest !== 'function') return;
        const caseModeBtn = e.target.closest('[data-case-mode]');
        if (caseModeBtn) {
          e.preventDefault();
          e.stopPropagation();
          const mode = caseModeBtn.getAttribute('data-case-mode');
          if (!self.state.partConfig) self.state.partConfig = {};
          self.state.partConfig.caseMode = mode;
          
          // Active-State aktualisieren
          modal.querySelectorAll('[data-case-mode]').forEach(btn => {
            btn.classList.remove('active');
          });
          caseModeBtn.classList.add('active');
          
          // Live-Preview aktualisieren
          setTimeout(updatePreview, 100);
        }
      });
      
      // Case-Mode Buttons aktivieren (für text - data-case)
      modal.addEventListener('click', function(e) {
        if (!e.target || typeof e.target.closest !== 'function') return;
        const caseBtn = e.target.closest('[data-case]');
        if (caseBtn) {
          e.preventDefault();
          e.stopPropagation();
          const mode = caseBtn.getAttribute('data-case');
          if (!self.state.partConfig) self.state.partConfig = {};
          self.state.partConfig.caseMode = mode;
          
          // Active-State aktualisieren
          modal.querySelectorAll('[data-case]').forEach(btn => {
            btn.classList.remove('active');
          });
          caseBtn.classList.add('active');
          
          // Live-Preview aktualisieren
          setTimeout(updatePreview, 100);
        }
      });
      
      // Case-Sensitive Checkbox aktivieren
      modal.addEventListener('change', function(e) {
        if (e.target.matches('[data-toggle="caseSensitive"]')) {
          if (!self.state.partConfig) self.state.partConfig = {};
          self.state.partConfig.caseSensitive = e.target.checked;
          
          // Live-Preview aktualisieren
          setTimeout(updatePreview, 100);
        }
      });
      
      // Initiale Vorschau anzeigen
      setTimeout(updatePreview, 150);
    },
    // initDelegation → globale Navigation & Erstinteraktion
    initDelegation: function() {
      const appEl = document.getElementById('app-container');
      if (!appEl) {
        return;
      }
      const self = this;
      if (!APP) return;

      appEl.addEventListener('click', function(e) {
        const t = e.target;
        
        // Modal-Events nicht von globaler Delegation behandeln
        if (t.closest('#snippet-modal') || t.closest('#tutorial-modal')) {
          return;
        }

        // 🔹 Navigation
        if (t.closest('[data-start]')) {
          e.preventDefault();
          self.state.view = 'templates';
          self.render();
          return;
        }

        if (t.closest('[data-back]')) {
          e.preventDefault();
          self.state.view = 'welcome';
          self.render();
          return;
        }

        // 🔹 Template-Karte
        const card = t.closest('[data-examples]');
        if (card) {
          const key = card.getAttribute('data-examples');
          const tpl = APP.getExampleTemplateById(key);

          if (!tpl) {
            const userFriendlyError = self.i18n?.userFriendlyErrors?.[self.state.lang]?.templateNotFound || 
                                      self.i18n?.userFriendlyErrors?.de?.templateNotFound ||
                                      'Diese Vorlage konnte nicht gefunden werden.';
            self.showToast(userFriendlyError, 'error');
            return;
          }

          self.state.parts = Array.isArray(tpl.parts)
            ? JSON.parse(JSON.stringify(tpl.parts)).map(p => {
                // Sicherstellen, dass alle Parts die notwendigen Flags haben
                return { ...p, configured: true, position: POSITION.ANYWHERE };
              })
            : [];

          self.state.testText = tpl.text || '';
          
          // Template Flags und Position übernehmen
          if (tpl.flags) {
            self.state.flags = { ...self.state.flags, ...tpl.flags };
          }
          if (tpl.position !== undefined) {
            self.state.position = tpl.position;
          } else {
            self.state.position = POSITION.ANYWHERE;
          }
          
          // Initialen Step basierend auf Parts-Status setzen
          self.state.step = self.getInitialStep();
          
          self.state.view = 'builder';
          self.state.adding = false;
          self.render();
          return;
        }
        
        // 🔹 Use-Case Cards (auf Welcome Page) - nur Info, keine Navigation
        const useCaseCard = t.closest('[data-use-case]');
        if (useCaseCard) {
          // Keine Navigation - Use-Cases sind nur Information
          return;
        }
        
        // 🔹 Tutorial starten
        const tutorialBtn = t.closest('[data-start-tutorial]');
        if (tutorialBtn) {
          e.preventDefault();
          self.showTutorial();
          return;
        }
        
        // 🔹 Builder-Template (Buttons im Unified-Selector) - nur im Builder
        const tplBtn = t.closest('[data-tpl]');
        if (tplBtn && self.state.view === 'builder') {
          e.preventDefault();
          const key = tplBtn.getAttribute('data-tpl');
          const tpl = self.builderTemplates && self.builderTemplates[key];
          if (!tpl) return;

          self.state.selectedTemplate = key;
          // Baustein-Auswahl zurücksetzen (exklusiv)
          self.state.partType = null;
          self.state.partConfig = null;
          
          // Öffne Modal mit empfohlenem Baustein-Typ
          self.state.adding = true;
          if (typeof self.makePart === 'function') {
            const kind = tpl.defaultPartType || (self.partTypes?.[0]?.id) || 'text';
            self.state.partType = kind;
            self.state.partConfig = self.makePart(kind);
            self.state.step = 'config'; // Wechsel zu Config-Step
          } else {
            self.state.partType = tpl.defaultPartType || null;
            self.state.partConfig = null;
            self.state.step = self.state.partType ? 'config' : 'type';
          }
          self.render();
          return;
        }
        // 🔹 Teil hinzufügen
        if (t.closest('[data-add-part]')) {
          e.preventDefault();
          self.state.adding = true;
          self.state.partType = null;
          self.state.partConfig = null;
          self.state.step = 'type'; // Start bei Step 1: Typ wählen
          self.render();
          return;
        }

        // 🔹 Teil entfernen
        const rem = t.closest('[data-remove-part]');
        if (rem) {
          e.preventDefault();
          const idx = parseInt(rem.getAttribute('data-remove-part'), 10);
          if (!isNaN(idx)) {
            self.state.parts.splice(idx, 1);
            self.markStateAsDirty();
            self.render();
          }
          return;
        }

        // 🔹 Teil verschieben (hoch/runter)
        const mover = t.closest('[data-move-part]');
        if (mover) {
          e.preventDefault();
          const dir = mover.getAttribute('data-move-part'); // 'up' | 'down'
          const idxAttr = mover.getAttribute('data-index');
          const idx = parseInt(idxAttr, 10);
          const parts = self.state.parts || [];
          if (!isNaN(idx) && parts.length > 1) {
            const target = dir === 'up' ? idx - 1 : idx + 1;
            if (target >= 0 && target < parts.length) {
              const tmp = parts[idx];
              parts[idx] = parts[target];
              parts[target] = tmp;
              self.state.parts = parts;
              self.render();
            }
          }
          return;
        }

        // 🔹 Copy
        if (t.closest('[data-copy]')) {
          e.preventDefault();
          const p = self.genPattern();
          const ta = document.createElement('textarea');
          ta.value = p;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
            alert(self.t('copySuccess') + '\n\n' + self.t('copyMsg'));
          } catch (err) {
            alert(p);
          }
          document.body.removeChild(ta);
          return;
        }

        // 🔹 Reset
        if (t.closest('[data-reset]')) {
          e.preventDefault();
          self.checkDirtyState(() => {
            self.showConfirm(self.t('confirmRestart'), self.t('lostData'), function() {
              self.state.view = 'templates';
              self.state.parts = [];
              self.state.testText = '';
              self.state.matches = [];
              self.state.adding = false;
              self.state.partType = null;
              self.state.isDirty = false;
              self.hideConfirm();
              self.render();
            });
          });
          return;
        }

        // 🔹 Add-Panel Steuerung (Baustein-Auswahl im Builder)
        const typeBtn = t.closest('[data-type]');
        if (typeBtn && self.state.view === 'builder') {
          e.preventDefault();
          const kind = typeBtn.getAttribute('data-type');
          self.state.partType = kind;
          self.state.newPart = { type: kind };
          // Vorlagen-Auswahl zurücksetzen (exklusiv)
          self.state.selectedTemplate = null;
          
          // Prefill config for selected part type to tailor the builder
          if (typeof self.makePart === 'function') {
            self.state.partConfig = self.makePart(kind);
          }
          self.state.adding = true;
          self.state.step = 'config'; // Wechsel zu Config-Step
          self.render();
          return;
        }

        if (t.closest('[data-cancel]')) {
          e.preventDefault();
          self.closeSnippetModal();
          self.render();
          return;
        }

        if (t.closest('[data-confirm]')) {
          e.preventDefault();
          const cfg = self.readConfig();
          // Validate before adding; stay in add flow if invalid
          if (!self.validateConfig || !self.validateConfig(self.state.partType, cfg)) {
            self.state.validationError = self.t ? (self.t('invalidConfig') || 'Konfiguration unvollständig/ungültig') : 'Konfiguration unvollständig/ungültig';
            const userFriendlyError = self.i18n?.userFriendlyErrors?.[self.state.lang]?.emptySnippet || 
                                      self.i18n?.userFriendlyErrors?.de?.emptySnippet ||
                                      'Bitte füllen Sie alle erforderlichen Felder aus.';
            self.showToast(userFriendlyError, 'error');
            self.renderSnippetModal(); // Re-render modal with error
            return;
          }
          if (self.state.selectedPartIndex !== undefined) {
            // Edit existing part
            self.state.parts[self.state.selectedPartIndex] = cfg;
            self.state.selectedPartIndex = undefined;
          } else {
            // Add new part
            self.state.parts.push(cfg);
          }
          self.state.validationError = '';
          self.closeSnippetModal();
          self.render();
          return;
        }

        // Snippet-Modal close buttons
        if (t.closest('[data-close-snippet]')) {
          e.preventDefault();
          self.closeSnippetModal();
          self.render();
          return;
        }

        if (t.closest('[data-confirm-snippet]')) {
          e.preventDefault();
          const cfg = self.readConfig();
          if (!self.validateConfig || !self.validateConfig(self.state.partType, cfg)) {
            // validationError wurde bereits in validateConfig gesetzt
            const errorMsg = self.state.validationError || 
                           self.t('invalidConfig') || 
                           'Konfiguration unvollständig/ungültig';
            self.showToast(errorMsg, 'error');
            self.renderSnippetModal();
            return;
          }
          if (self.state.selectedPartIndex !== undefined) {
            self.state.parts[self.state.selectedPartIndex] = cfg;
            self.state.selectedPartIndex = undefined;
          } else {
            self.state.parts.push(cfg);
          }
          self.state.validationError = '';
          self.markStateAsDirty();
          
          // Erfolgs-Toast anzeigen
          const successMsg = self.i18n?.patternCreatedSuccess?.[self.state.lang] || 
                            self.i18n?.patternCreatedSuccess?.de ||
                            '✓ Pattern erfolgreich erstellt! Sie können es jetzt kopieren.';
          self.showToast(successMsg, 'success');
          
          self.closeSnippetModal();
          self.render();
          return;
        }
      });
    },
    // --- Fabrikfunktion ---
    makePart: function(kind) {
      switch (kind) {
            case 'text':      return { type: 'text', value: '' };
            case 'numbers':   return { type: 'numbers', min: 1, max: '', whitelist: [], blacklist: [], mode: 'char'};
            case 'letters':   return { type: 'letters', min: 1, max: '', whitelist: [], blacklist: [], mode: 'char'};
            case 'mixed':     return { type: 'mixed', min: 1, max: '', extraChars: '.,:/€$', whitelist: [], blacklist: [], mode: 'char'};
            case 'special':   return { type: 'special', min: 1, max: '', whitelist: [], blacklist: [], mode: 'char'};
            case 'choice':    return { type: 'choice', options: [] };
            case 'delimiter': return { type: 'delimiter', value: '', whitelist: [], blacklist: [], mode: 'term'};
            case 'whitelist': return { type: 'whitelist', values: [], mode: 'term' };
            case 'blacklist': return { type: 'blacklist', values: [], mode: 'term' };
            default:          return null;
      }
    },

    //
    // Basic validation for part configuration
    validateConfig: function(partType, cfg) {
      if (!partType || !cfg || typeof cfg !== 'object') {
        this.state.validationError = this.t('invalidConfig') || 'Konfiguration unvollständig/ungültig';
        return false;
      }
      
      switch (partType) {
        case 'text': {
          if (typeof cfg.value !== 'string') {
            this.state.validationError = this.t('textEmpty') || 'Text darf nicht leer sein.';
            return false;
          }
          if (cfg.value.length === 0) {
            this.state.validationError = this.t('textEmpty') || 'Text darf nicht leer sein.';
            return false;
          }
          if (cfg.value.length > 1000) {
            this.state.validationError = this.t('textTooLong') || 'Text ist zu lang (max. 1000 Zeichen).';
            return false;
          }
          return true;
        }
        
        case 'numbers':
        case 'letters':
        case 'mixed':
        case 'special': {
          if (!Number.isInteger(cfg.min) || cfg.min < 0 || cfg.min > 10000) {
            this.state.validationError = this.t('minInvalid') || 'Mindestanzahl muss zwischen 0 und 10000 liegen.';
            return false;
          }
          if (cfg.max !== '' && (!Number.isInteger(cfg.max) || cfg.max < cfg.min || cfg.max > 10000)) {
            this.state.validationError = this.t('maxInvalid') || 'Maximalanzahl muss größer oder gleich der Mindestanzahl sein (max. 10000).';
            return false;
          }
          if (cfg.minMode === 'exact' && cfg.max !== '' && cfg.max !== cfg.min) {
            this.state.validationError = this.t('minModeExactMax') || 'Bei "Genau" muss die Maximalanzahl gleich der Mindestanzahl sein.';
            return false;
          }
          // Whitelist/Blacklist Validierung für numbers/letters/mixed/special
          if (cfg.whitelist && Array.isArray(cfg.whitelist)) {
            if (cfg.whitelist.length > 100) {
              this.state.validationError = this.t('whitelistTooMany') || 'Zu viele Whitelist-Werte (max. 100).';
              return false;
            }
            const hasEmpty = cfg.whitelist.some(v => !v || (typeof v === 'string' && v.trim().length === 0));
            if (hasEmpty) {
              this.state.validationError = this.t('whitelistEmptyItem') || 'Leere Werte gefunden. Bitte entfernen Sie leere Einträge.';
              return false;
            }
          }
          if (cfg.blacklist && Array.isArray(cfg.blacklist)) {
            if (cfg.blacklist.length > 100) {
              this.state.validationError = this.t('blacklistTooMany') || 'Zu viele Blacklist-Werte (max. 100).';
              return false;
            }
            const hasEmpty = cfg.blacklist.some(v => !v || (typeof v === 'string' && v.trim().length === 0));
            if (hasEmpty) {
              this.state.validationError = this.t('blacklistEmptyItem') || 'Leere Werte gefunden. Bitte entfernen Sie leere Einträge.';
              return false;
            }
          }
          return true;
        }
        
        case 'choice': {
          const choices = cfg.choices || cfg.values || [];
          if (!Array.isArray(choices) || choices.length === 0) {
            this.state.validationError = this.t('choiceEmpty') || 'Bitte geben Sie mindestens eine Option ein.';
            return false;
          }
          if (choices.length > 100) {
            this.state.validationError = this.t('choiceTooMany') || 'Zu viele Optionen (max. 100).';
            return false;
          }
          const trimmed = choices.map(c => String(c).trim()).filter(c => c.length > 0);
          if (trimmed.length !== choices.length) {
            this.state.validationError = this.t('choiceEmptyItem') || 'Leere Optionen gefunden. Bitte entfernen Sie leere Einträge.';
            return false;
          }
          const unique = new Set(trimmed);
          if (unique.size !== trimmed.length) {
            this.state.validationError = this.t('choiceDuplicate') || 'Doppelte Optionen gefunden. Bitte entfernen Sie Duplikate.';
            return false;
          }
          return true;
        }
        
        case 'delimiter': {
          if (typeof cfg.value !== 'string' || cfg.value.length === 0) {
            this.state.validationError = this.t('delimiterEmpty') || 'Trennzeichen darf nicht leer sein.';
            return false;
          }
          if (cfg.value.length > 10) {
            this.state.validationError = this.t('delimiterTooLong') || 'Trennzeichen ist zu lang (max. 10 Zeichen).';
            return false;
          }
          return true;
        }
        
        case 'whitelist': {
          if (!Array.isArray(cfg.values) || cfg.values.length === 0) {
            this.state.validationError = this.t('whitelistEmpty') || 'Bitte geben Sie mindestens einen Wert ein.';
            return false;
          }
          if (cfg.values.length > 100) {
            this.state.validationError = this.t('whitelistTooMany') || 'Zu viele Whitelist-Werte (max. 100).';
            return false;
          }
          const validValues = cfg.values.every(v => typeof v === 'string' && v.trim().length > 0);
          if (!validValues) {
            this.state.validationError = this.t('whitelistEmptyItem') || 'Leere Werte gefunden. Bitte entfernen Sie leere Einträge.';
            return false;
          }
          const modeOk = cfg.mode === 'char' || cfg.mode === 'term';
          if (!modeOk) {
            this.state.validationError = this.t('invalidMode') || 'Ungültiger Modus ausgewählt.';
            return false;
          }
          return true;
        }
        
        case 'blacklist': {
          if (!Array.isArray(cfg.values) || cfg.values.length === 0) {
            this.state.validationError = this.t('blacklistEmpty') || 'Bitte geben Sie mindestens einen Wert ein.';
            return false;
          }
          if (cfg.values.length > 100) {
            this.state.validationError = this.t('blacklistTooMany') || 'Zu viele Blacklist-Werte (max. 100).';
            return false;
          }
          const validValues = cfg.values.every(v => typeof v === 'string' && v.trim().length > 0);
          if (!validValues) {
            this.state.validationError = this.t('blacklistEmptyItem') || 'Leere Werte gefunden. Bitte entfernen Sie leere Einträge.';
            return false;
          }
          const modeOk = cfg.mode === 'char' || cfg.mode === 'term' || cfg.mode === 'contains';
          if (!modeOk) {
            this.state.validationError = this.t('invalidMode') || 'Ungültiger Modus ausgewählt.';
            return false;
          }
          return true;
        }
        
        default:
          this.state.validationError = this.t('invalidConfig') || 'Konfiguration unvollständig/ungültig';
          return false;
      }
