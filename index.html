    // Pattern parsen und analysieren
    parsePattern: function(patternString) {
      if (!patternString || !patternString.trim()) {
        return { error: this.t('analyzerNoPattern') || 'Bitte geben Sie ein RegEx-Pattern ein.' };
      }
      
      // Entferne führende/abschließende Slashes und extrahiere Flags
      let pattern = patternString.trim();
      let flags = '';
      
      if (pattern.startsWith('/')) {
        const lastSlash = pattern.lastIndexOf('/');
        if (lastSlash > 0) {
          flags = pattern.substring(lastSlash + 1);
          pattern = pattern.substring(1, lastSlash);
        }
      }
      
      // Versuche Pattern zu erstellen
      try {
        const regex = new RegExp(pattern, flags);
      } catch (e) {
        return { error: this.t('analyzerInvalidPattern') || 'Ungültiges Pattern. Bitte prüfen Sie die Syntax.' };
      }
      
      const components = [];
      let i = 0;
      const len = pattern.length;
      
      while (i < len) {
        const char = pattern[i];
        
        // Anker: ^ oder $
        if (char === '^') {
          components.push({
            type: 'anchor',
            value: '^',
            description: { de: 'Anfang der Zeile/Zeichenkette', en: 'Start of line/string' }
          });
          i++;
        } else if (char === '$') {
          components.push({
            type: 'anchor',
            value: '$',
            description: { de: 'Ende der Zeile/Zeichenkette', en: 'End of line/string' }
          });
          i++;
        }
        // Word Boundary: \b oder \B
        else if (char === '\\' && i + 1 < len) {
          const next = pattern[i + 1];
          if (next === 'b') {
            components.push({
              type: 'anchor',
              value: '\\b',
              description: { de: 'Wortgrenze', en: 'Word boundary' }
            });
            i += 2;
          } else if (next === 'B') {
            components.push({
              type: 'anchor',
              value: '\\B',
              description: { de: 'Keine Wortgrenze', en: 'Non-word boundary' }
            });
            i += 2;
          } else if (next === 'd') {
            components.push({
              type: 'characterClass',
              value: '\\d',
              description: { de: 'Ziffern (0-9)', en: 'Digits (0-9)' },
              equivalent: '[0-9]'
            });
            i += 2;
          } else if (next === 'D') {
            components.push({
              type: 'characterClass',
              value: '\\D',
              description: { de: 'Keine Ziffern', en: 'Non-digits' },
              equivalent: '[^0-9]'
            });
            i += 2;
          } else if (next === 'w') {
            components.push({
              type: 'characterClass',
              value: '\\w',
              description: { de: 'Wortzeichen (Buchstaben, Ziffern, Unterstrich)', en: 'Word characters (letters, digits, underscore)' },
              equivalent: '[A-Za-z0-9_]'
            });
            i += 2;
          } else if (next === 'W') {
            components.push({
              type: 'characterClass',
              value: '\\W',
              description: { de: 'Keine Wortzeichen', en: 'Non-word characters' },
              equivalent: '[^A-Za-z0-9_]'
            });
            i += 2;
          } else if (next === 's') {
            components.push({
              type: 'characterClass',
              value: '\\s',
              description: { de: 'Leerzeichen', en: 'Whitespace' }
            });
            i += 2;
          } else if (next === 'S') {
            components.push({
              type: 'characterClass',
              value: '\\S',
              description: { de: 'Keine Leerzeichen', en: 'Non-whitespace' }
            });
            i += 2;
          } else {
            // Escaped character
            components.push({
              type: 'literal',
              value: '\\' + next,
              description: { de: `Escaped Zeichen: ${next}`, en: `Escaped character: ${next}` }
            });
            i += 2;
          }
        }
        // Character Class: [...]
        else if (char === '[') {
          const endBracket = pattern.indexOf(']', i);
          if (endBracket === -1) {
            return { error: 'Ungeschlossene Character Class' };
          }
          const charClass = pattern.substring(i, endBracket + 1);
          const isNegated = pattern[i + 1] === '^';
          components.push({
            type: 'characterClass',
            value: charClass,
            negated: isNegated,
            description: { 
              de: isNegated ? 'Negative Character Class' : 'Positive Character Class',
              en: isNegated ? 'Negative Character Class' : 'Positive Character Class'
            }
          });
          i = endBracket + 1;
        }
        // Gruppe: (...)
        else if (char === '(') {
          const groupEnd = this.findGroupEnd(pattern, i);
          if (groupEnd === -1) {
            return { error: 'Ungeschlossene Gruppe' };
          }
          const groupContent = pattern.substring(i, groupEnd + 1);
          const isNonCapturing = pattern.substring(i, i + 3) === '(?:';
          components.push({
            type: 'group',
            value: groupContent,
            nonCapturing: isNonCapturing,
            description: { 
              de: isNonCapturing ? 'Non-capturing Gruppe' : 'Capturing Gruppe',
              en: isNonCapturing ? 'Non-capturing group' : 'Capturing group'
            }
          });
          i = groupEnd + 1;
        }
        // Quantifier: ?, *, +, {n}, {n,m}, {n,}
        else if (char === '?' || char === '*' || char === '+') {
          const prev = components[components.length - 1];
          if (prev) {
            prev.quantifier = char;
            if (char === '?') {
              prev.quantifierDesc = { de: '0 oder 1 Mal', en: '0 or 1 times' };
            } else if (char === '*') {
              prev.quantifierDesc = { de: '0 oder mehr Mal', en: '0 or more times' };
            } else {
              prev.quantifierDesc = { de: '1 oder mehr Mal', en: '1 or more times' };
            }
          }
          i++;
        } else if (char === '{') {
          const braceEnd = pattern.indexOf('}', i);
          if (braceEnd === -1) {
            return { error: 'Ungeschlossene Quantifier-Braces' };
          }
          const quantifier = pattern.substring(i, braceEnd + 1);
          const prev = components[components.length - 1];
          if (prev) {
            prev.quantifier = quantifier;
            const match = quantifier.match(/\{(\d+)(?:,(\d+)?)?\}/);
            if (match) {
              const min = parseInt(match[1]);
              const max = match[2] ? parseInt(match[2]) : null;
              if (max === null) {
                prev.quantifierDesc = { de: `Mindestens ${min} Mal`, en: `At least ${min} times` };
              } else if (min === max) {
                prev.quantifierDesc = { de: `Genau ${min} Mal`, en: `Exactly ${min} times` };
              } else {
                prev.quantifierDesc = { de: `Zwischen ${min} und ${max} Mal`, en: `Between ${min} and ${max} times` };
              }
            }
          }
          i = braceEnd + 1;
        }
        // Alternation: |
        else if (char === '|') {
          components.push({
            type: 'alternation',
            value: '|',
            description: { de: 'ODER (Alternation)', en: 'OR (Alternation)' }
          });
          i++;
        }
        // Literal
        else {
          components.push({
            type: 'literal',
            value: char,
            description: { de: `Literal: "${char}"`, en: `Literal: "${char}"` }
          });
          i++;
        }
      }
      
      if (components.length === 0) {
        return { error: this.t('analyzerNoComponents') || 'Keine Komponenten gefunden.' };
      }
      
      return { components, flags, pattern };
    },
    
    // Findet das Ende einer Gruppe (berücksichtigt verschachtelte Gruppen)
    findGroupEnd: function(pattern, start) {
      let depth = 1;
      let i = start + 1;
      while (i < pattern.length && depth > 0) {
        if (pattern[i] === '(') depth++;
        else if (pattern[i] === ')') depth--;
        i++;
      }
      return depth === 0 ? i - 1 : -1;
    },
    
    // Analyzer-Events binden
    attachAnalyzerEvents: function() {
      const self = this;
      const analyzeBtn = document.getElementById('analyzer-analyze-btn');
      const patternInput = document.getElementById('analyzer-pattern-input');
      
      if (analyzeBtn) {
        analyzeBtn.onclick = function() {
          const pattern = patternInput.value.trim();
          const result = self.parsePattern(pattern);
          
          const resultsDiv = document.getElementById('analyzer-results');
          const errorDiv = document.getElementById('analyzer-error');
          
          if (result.error) {
            errorDiv.textContent = result.error;
            errorDiv.style.display = 'block';
            resultsDiv.style.display = 'none';
            return;
          }
          
          errorDiv.style.display = 'none';
          resultsDiv.style.display = 'block';
          
          // Komponenten rendern
          const componentsList = document.getElementById('analyzer-components-list');
          const lang = self.lang();
          componentsList.innerHTML = result.components.map((comp, idx) => {
            const desc = typeof comp.description === 'object' ? (comp.description[lang] || comp.description.de) : comp.description;
            const quantDesc = comp.quantifierDesc ? (typeof comp.quantifierDesc === 'object' ? (comp.quantifierDesc[lang] || comp.quantifierDesc.de) : comp.quantifierDesc) : '';
            return `
              <div class="analyzer-component">
                <code class="analyzer-component-value">${self.esc(comp.value)}</code>
                ${comp.quantifier ? `<code class="analyzer-quantifier">${self.esc(comp.quantifier)}</code>` : ''}
                <span class="analyzer-component-desc">${self.esc(desc)}</span>
                ${quantDesc ? `<span class="analyzer-quantifier-desc">(${self.esc(quantDesc)})</span>` : ''}
                ${comp.equivalent ? `<span class="analyzer-equivalent">= ${self.esc(comp.equivalent)}</span>` : ''}
              </div>
            `;
          }).join('');
          
          // Erklärung rendern
          const explanationText = document.getElementById('analyzer-explanation-text');
          explanationText.innerHTML = `<p>${self.t('analyzerComponents')} ${result.components.length}</p>`;
          
          // Flags rendern
          const flagsList = document.getElementById('analyzer-flags-list');
          if (result.flags) {
            const flagDescriptions = {
              'g': { de: 'Global: Alle Matches finden', en: 'Global: Find all matches' },
              'i': { de: 'Case-insensitive: Groß-/Kleinschreibung ignorieren', en: 'Case-insensitive: Ignore case' },
              'm': { de: 'Multiline: ^ und $ matchen Zeilenanfang/-ende', en: 'Multiline: ^ and $ match line start/end' },
              's': { de: 'DotAll: . matched auch Zeilenumbrüche', en: 'DotAll: . matches newlines too' },
              'u': { de: 'Unicode: Unicode-Unterstützung', en: 'Unicode: Unicode support' }
            };
            flagsList.innerHTML = [...result.flags].map(flag => {
              const desc = flagDescriptions[flag] ? (flagDescriptions[flag][lang] || flagDescriptions[flag].de) : flag;
              return `<div class="analyzer-flag"><code>${flag}</code> - ${desc}</div>`;
            }).join('');
          } else {
            flagsList.innerHTML = '<p>' + (lang === 'de' ? 'Keine Flags gesetzt' : 'No flags set') + '</p>';
          }
        };
      }
      
      // Enter-Taste unterstützen
      if (patternInput) {
        patternInput.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && e.ctrlKey) {
            analyzeBtn.click();
          }
        });
      }
    },

    // Initialen Step basierend auf aktuellen Zustand ermitteln
    getInitialStep: function() {
      const parts = this.state.parts || [];
      
      // Wenn keine Parts vorhanden → Start bei "type"
      if (parts.length === 0) {
        return 'type';
      }
      
      // Wenn Parts vorhanden sind, prüfe deren Status
      const allConfigured = parts.every(p => p.configured);
      const allHavePosition = parts.every(p => p.position);
      
      // Wenn alle Parts konfiguriert und haben Position → "preview"
      if (allConfigured && allHavePosition) {
        return 'preview';
      }
      
      // Wenn alle Parts konfiguriert aber keine Position → "position"
      if (allConfigured && !allHavePosition) {
        return 'position';
      }
      
      // Wenn Parts vorhanden aber nicht alle konfiguriert → "config"
      return 'config';
    },

    //  
    // Generiert Regex-Snippet für einen einzelnen Part
    buildSnippetForPart: function(part) {
      if (!part || !part.type) return '';
      
      // Wenn customPattern vorhanden ist, verwende dieses direkt
      if (part.customPattern) {
        return part.customPattern;
      }
      
      const p = part;
      let snippet = '';

      switch (p.type) {
        case 'whitelist': {
          if (!p.values || !Array.isArray(p.values) || p.values.length === 0) return '';
          const values = p.values.map(this.escRegex);
          snippet = p.mode === 'char'
            ? '(?:[' + values.join('') + '])'
            : '(?:' + values.join('|') + ')';
          break;
        }
        case 'blacklist': {
          if (!p.values || !Array.isArray(p.values) || p.values.length === 0) return '';
          const values = p.values.map(this.escRegex);
          if (p.mode === 'char') {
            snippet = '(?![' + values.join('') + ']).';
          } else if (p.mode === 'term') {
            snippet = '(?!' + values.join('|') + ').+';
          } else if (p.mode === 'contains') {
            snippet = '(?!.*(?:' + values.join('|') + ')).+';
          }
          break;
        }
        case 'text': {
          const val = this.escRegex(p.value || '');
          let base = val;
          if (p.caseMode === 'lower') {
            base = '(?=^[a-z]+$)' + base;
          } else if (p.caseMode === 'upper') {
            base = '(?=^[A-Z]+$)' + base;
          }
          snippet = this.applyWLBL(p, base);
          break;
        }
        case 'numbers': {
          let quantifier = '';
          if (p.quantifierMode === 'optional') {
            quantifier = '?';
          } else if (p.quantifierMode === 'zeroOrMore') {
            quantifier = '*';
          } else if (p.quantifierMode === 'oneOrMore') {
            quantifier = '+';
          } else {
            const min = p.min || 1;
            const max = p.max;
            // Wenn min und max gleich sind, vereinfachen: {2,2} → {2}
            if (max !== undefined && max !== '' && !isNaN(max) && min === max) {
              quantifier = '{' + min + '}';
            } else if (max !== undefined && max !== '' && !isNaN(max)) {
              quantifier = '{' + min + ',' + max + '}';
            } else {
              quantifier = '{' + min + ',}';
            }
          }
          snippet = '[0-9]' + quantifier;
          snippet = this.applyWLBL(p, snippet);
          break;
        }
        case 'letters': {
          let base = '';
          if (p.chars && Array.isArray(p.chars)) {
            let charClass = '';
            if (p.chars.includes('A-Z')) charClass += 'A-Z';
            if (p.chars.includes('a-z')) charClass += 'a-z';
            if (charClass === '') charClass = 'A-Za-z'; // Fallback wenn leer
            base = '[' + charClass + ']';
          } else {
            base = '[A-Za-z]';
          }
          
          let quantifier = '';
          if (p.quantifierMode === 'optional') {
            quantifier = '?';
          } else if (p.quantifierMode === 'zeroOrMore') {
            quantifier = '*';
          } else if (p.quantifierMode === 'oneOrMore') {
            quantifier = '+';
          } else {
            const min = p.min || 1;
            const max = p.max;
            // Wenn min und max gleich sind, vereinfachen: {2,2} → {2}
            if (max !== undefined && max !== '' && !isNaN(max) && min === max) {
              quantifier = '{' + min + '}';
            } else if (max !== undefined && max !== '' && !isNaN(max)) {
              quantifier = '{' + min + ',' + max + '}';
            } else {
              quantifier = '{' + min + ',}';
            }
          }
          // Case-Mode direkt in Character-Class anwenden
          if (p.caseMode === 'lower') {
            base = '[a-z]';
          } else if (p.caseMode === 'upper') {
            base = '[A-Z]';
          }
          // else bleibt [A-Za-z] oder das was aus chars Array kam
          
          base += quantifier;
          snippet = this.applyWLBL(p, base);
          break;
        }
        case 'mixed': {
          const extra = p.extraChars || '.,:/€$';
          let base = '[A-Za-z0-9' + this.escRegex(extra) + ']';
          
          let quantifier = '';
          if (p.quantifierMode === 'optional') {
            quantifier = '?';
          } else if (p.quantifierMode === 'zeroOrMore') {
            quantifier = '*';
          } else if (p.quantifierMode === 'oneOrMore') {
            quantifier = '+';
          } else {
            const min = p.min || 1;
            const max = p.max;
            // Wenn min und max gleich sind, vereinfachen: {2,2} → {2}
            if (max !== undefined && max !== '' && !isNaN(max) && min === max) {
              quantifier = '{' + min + '}';
            } else if (max !== undefined && max !== '' && !isNaN(max)) {
              quantifier = '{' + min + ',' + max + '}';
            } else {
              quantifier = '{' + min + ',}';
            }
          }
          // Case-Mode direkt in Character-Class anwenden
          if (p.caseMode === 'lower') {
            base = '[a-z0-9' + this.escRegex(extra) + ']';
          } else if (p.caseMode === 'upper') {
            base = '[A-Z0-9' + this.escRegex(extra) + ']';
          }
          // else bleibt [A-Za-z0-9...]
          
          base += quantifier;
          snippet = this.applyWLBL(p, base);
          break;
        }
        case 'delimiter': {
          const base = this.escRegex(p.value || '');
          snippet = this.applyWLBL(p, base);
          break;
        }
        case 'special': {
          let quantifier = '';
          if (p.quantifierMode === 'optional') {
            quantifier = '?';
          } else if (p.quantifierMode === 'zeroOrMore') {
            quantifier = '*';
          } else if (p.quantifierMode === 'oneOrMore') {
            quantifier = '+';
          } else {
            const min = p.min || 1;
            const max = p.max;
            // Wenn min und max gleich sind, vereinfachen: {2,2} → {2}
            if (max !== undefined && max !== '' && !isNaN(max) && min === max) {
              quantifier = '{' + min + '}';
            } else if (max !== undefined && max !== '' && !isNaN(max)) {
              quantifier = '{' + min + ',' + max + '}';
            } else {
              quantifier = '{' + min + ',}';
            }
          }
          snippet = '[^A-Za-z0-9]' + quantifier;
          snippet = this.applyWLBL(p, snippet);
          break;
        }
        case 'choice': {
          const values = p.values || p.choices || [];
          if (!Array.isArray(values) || values.length === 0) return '';
          const choices = values.map(this.escRegex).join('|');
          snippet = '(?:' + choices + ')';
          break;
        }
        default: {
          snippet = '';
          break;
        }
      }
      
      return snippet;
    },
    // Generiert farblich markiertes Pattern mit Snippets
    renderHighlightedPattern: function(pattern) {
      if (!pattern || !pattern.source) return this.esc(pattern?.source || '');
      
      const fullPattern = pattern.source;
      if (!fullPattern || fullPattern.length === 0) return '';
      
      const snippets = [];
      
      // Generiere Snippets für alle Parts
      for (let i = 0; i < this.state.parts.length; i++) {
        const part = this.state.parts[i];
        if (!part || !part.type) continue;
        
        try {
          const snippet = this.buildSnippetForPart(part);
          if (snippet && snippet.length > 0) {
            snippets.push({
              text: snippet,
              type: part.type,
              index: i
            });
          }
        } catch (e) {
          continue;
        }
      }
      
      if (snippets.length === 0) {
        return this.esc(fullPattern);
      }
      
      // Erstelle Highlighted HTML
      let highlighted = '';
      let currentPos = 0;
      
      // Versuche, jedes Snippet im Pattern zu finden und zu markieren
      for (const snippet of snippets) {
        try {
          const escapedSnippet = this.escRegex(snippet.text);
          // Escape für Regex-Special-Chars
          const regexPattern = escapedSnippet.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(regexPattern);
          const match = fullPattern.slice(currentPos).match(regex);
          
          if (match && match.index !== undefined) {
            // Text vor dem Snippet
            highlighted += this.esc(fullPattern.slice(currentPos, currentPos + match.index));
            // Highlighted Snippet
            highlighted += `<span class="snippet-highlight" data-type="${snippet.type}" data-index="${snippet.index}" title="${this.esc(snippet.text)}">${this.esc(match[0])}</span>`;
            currentPos += match.index + match[0].length;
          }
        } catch (e) {
          // Falls Matching fehlschlägt, einfach Text hinzufügen
          continue;
        }
      }
      
      // Rest des Patterns
      if (currentPos < fullPattern.length) {
        highlighted += this.esc(fullPattern.slice(currentPos));
      }
      
      return highlighted || this.esc(fullPattern);
    },
    buildPatternFromParts: function() {
      let regex = '';

      for (let i = 0; i < this.state.parts.length; i++) {
        const p = this.state.parts[i];

        switch (p.type) {
          case 'whitelist': {
            if (!p.values || !Array.isArray(p.values) || p.values.length === 0) {
              break;
            }
            const values = p.values.map(this.escRegex);
            regex += p.mode === 'char'
              ? '(?:[' + values.join('') + '])'
              : '(?:' + values.join('|') + ')';
            break;
          }

          case 'blacklist': {
            if (!p.values || !Array.isArray(p.values) || p.values.length === 0) {
              break;
            }
            const values = p.values.map(this.escRegex);
            if (p.mode === 'char') {
              regex += '(?![' + values.join('') + ']).';
            } else if (p.mode === 'term') {
              regex += '(?!' + values.join('|') + ').+';
            } else if (p.mode === 'contains') {
              regex += '(?!.*(?:' + values.join('|') + ')).+';
            }
            break;
          }

          case 'text': {
            const val = this.escRegex(p.value || '');
            let base = val;

            if (p.caseMode === 'lower') {
              base = '(?=^[a-z]+$)' + base;
            } else if (p.caseMode === 'upper') {
              base = '(?=^[A-Z]+$)' + base;
            }

            base = this.applyWLBL(p, base);
            // Optional-Markierung anwenden
            if (p.isOptional) {
              base = '(?:' + base + ')?';
            }
            regex += base;
            break;
          }

          case 'numbers': {
            let quantifier = '';
            if (p.quantifierMode === 'optional') {
              quantifier = '?';
            } else if (p.quantifierMode === 'zeroOrMore') {
              quantifier = '*';
            } else if (p.quantifierMode === 'oneOrMore') {
              quantifier = '+';
            } else {
              const min = p.min || 1;
              const max = p.max;
              // Wenn min und max gleich sind, vereinfachen: {2,2} → {2}
              if (max !== undefined && max !== '' && !isNaN(max) && min === max) {
                quantifier = '{' + min + '}';
              } else if (max !== undefined && max !== '' && !isNaN(max)) {
                quantifier = '{' + min + ',' + max + '}';
              } else {
                quantifier = '{' + min + ',}';
              }
            }
            let base = this.applyWLBL(p, '[0-9]' + quantifier);
            // Optional-Markierung anwenden
            if (p.isOptional) {
              base = '(?:' + base + ')?';
            }
            regex += base;
            break;
          }

          case 'letters': {
            // Unterstützung für altes Format mit chars Array
            let base = '';
            if (p.chars && Array.isArray(p.chars)) {
              // Altes Format: chars: ['A-Z'] oder ['a-z'] oder ['A-Z', 'a-z']
              let charClass = '';
              if (p.chars.includes('A-Z')) charClass += 'A-Z';
              if (p.chars.includes('a-z')) charClass += 'a-z';
              if (charClass === '') charClass = 'A-Za-z'; // Fallback wenn leer
              base = '[' + charClass + ']';
            } else {
              // Neues Format: caseMode
              base = '[A-Za-z]';
            }
            
            let quantifier = '';
            if (p.quantifierMode === 'optional') {
              quantifier = '?';
            } else if (p.quantifierMode === 'zeroOrMore') {
              quantifier = '*';
            } else if (p.quantifierMode === 'oneOrMore') {
              quantifier = '+';
            } else {
              const min = p.min || 1;
              const max = p.max;
              // Wenn min und max gleich sind, vereinfachen: {2,2} → {2}
              if (max !== undefined && max !== '' && !isNaN(max) && min === max) {
                quantifier = '{' + min + '}';
              } else if (max !== undefined && max !== '' && !isNaN(max)) {
                quantifier = '{' + min + ',' + max + '}';
              } else {
                quantifier = '{' + min + ',}';
              }
            }
            // Case-Mode direkt in Character-Class anwenden
            if (p.caseMode === 'lower') {
              base = '[a-z]';
            } else if (p.caseMode === 'upper') {
              base = '[A-Z]';
            }
            // else bleibt [A-Za-z] oder das was aus chars Array kam
            
            base += quantifier;
            base = this.applyWLBL(p, base);
            // Optional-Markierung anwenden
            if (p.isOptional) {
              base = '(?:' + base + ')?';
            }
            regex += base;
            break;
          }

          case 'mixed': {
            const extra = p.extraChars || '.,:/€$';
            let base = '[A-Za-z0-9' + this.escRegex(extra) + ']';
            
            let quantifier = '';
            if (p.quantifierMode === 'optional') {
              quantifier = '?';
            } else if (p.quantifierMode === 'zeroOrMore') {
              quantifier = '*';
            } else if (p.quantifierMode === 'oneOrMore') {
              quantifier = '+';
            } else {
              const min = p.min || 1;
              const max = p.max;
              // Wenn min und max gleich sind, vereinfachen: {2,2} → {2}
              if (max !== undefined && max !== '' && !isNaN(max) && min === max) {
                quantifier = '{' + min + '}';
              } else if (max !== undefined && max !== '' && !isNaN(max)) {
                quantifier = '{' + min + ',' + max + '}';
              } else {
                quantifier = '{' + min + ',}';
              }
            }
            // Case-Mode direkt in Character-Class anwenden
            if (p.caseMode === 'lower') {
              base = '[a-z0-9' + this.escRegex(extra) + ']';
            } else if (p.caseMode === 'upper') {
              base = '[A-Z0-9' + this.escRegex(extra) + ']';
            }
            // else bleibt [A-Za-z0-9...]
            
            base += quantifier;
            base = this.applyWLBL(p, base);
            // Optional-Markierung anwenden
            if (p.isOptional) {
              base = '(?:' + base + ')?';
            }
            regex += base;
            break;
          }

          case 'delimiter': {
            let base = this.escRegex(p.value || '');
            base = this.applyWLBL(p, base);
            // Optional-Markierung anwenden
            if (p.isOptional) {
              base = '(?:' + base + ')?';
            }
            regex += base;
            break;
          }

          case 'special': {
            let quantifier = '';
            if (p.quantifierMode === 'optional') {
              quantifier = '?';
            } else if (p.quantifierMode === 'zeroOrMore') {
              quantifier = '*';
            } else if (p.quantifierMode === 'oneOrMore') {
              quantifier = '+';
            } else {
              const min = p.min || 1;
              const max = p.max;
              // Wenn min und max gleich sind, vereinfachen: {2,2} → {2}
              if (max !== undefined && max !== '' && !isNaN(max) && min === max) {
                quantifier = '{' + min + '}';
              } else if (max !== undefined && max !== '' && !isNaN(max)) {
                quantifier = '{' + min + ',' + max + '}';
              } else {
                quantifier = '{' + min + ',}';
              }
            }
            let base = this.applyWLBL(p, '[^A-Za-z0-9]' + quantifier);
            // Optional-Markierung anwenden
            if (p.isOptional) {
              base = '(?:' + base + ')?';
            }
            regex += base;
            break;
          }

          case 'choice': {
            // Unterstützung für values (aus Templates) und choices (aus Konfiguration)
            const values = p.values || p.choices || [];
            if (!Array.isArray(values) || values.length === 0) {
              break;
            }
            const choices = values.map(this.escRegex).join('|');
            let choicePattern = '(?:' + choices + ')';
            // Optional-Markierung anwenden
            if (p.isOptional) {
              choicePattern = '(?:' + choicePattern + ')?';
            }
            regex += choicePattern;
            break;
          }

          default: {
            break;
          }
        }
      }

      return regex;
    },
    //  
    cleanPattern: function(pattern) {
      // Falls ein RegExp übergeben wurde, extrahiere das Pattern
      if (pattern instanceof RegExp) {
        pattern = pattern.source;
      }

      if (!pattern || pattern.length === 0) return pattern;

      // Anker prüfen
      const hasStartAnchor = pattern.startsWith('^');
      const hasEndAnchor = pattern.endsWith('$');

      // Anker temporär entfernen
      if (hasStartAnchor) pattern = pattern.slice(1);
      if (hasEndAnchor) pattern = pattern.slice(0, -1);

      // 1. Quantifier vereinfachen (mehrfach anwenden für verschachtelte Fälle)
      let changed = true;
      let iterations = 0;
      while (changed && iterations < 10) {
        const before = pattern;
        
        // {n,n} → {n}
        pattern = pattern.replace(/\{(\d+),\1\}/g, '{$1}');
        
        // {0,} → *
        pattern = pattern.replace(/\{0,\}/g, '*');
        
        // {1,} → +
        pattern = pattern.replace(/\{1,\}/g, '+');
        
        // {0,1} → ?
        pattern = pattern.replace(/\{0,1\}/g, '?');
        
        // {1} → (entfernen, aber nur wenn nicht Teil einer Zeichenklasse)
        pattern = pattern.replace(/([^\[\]\(\)])\{1\}(?![\*\+\?])/g, '$1');
        
        changed = (pattern !== before);
        iterations++;
      }

      // 2. Character Classes vereinfachen
      pattern = pattern.replace(/\[0-9\]/g, '\\d');
      pattern = pattern.replace(/\[a-zA-Z0-9_\]/g, '\\w');
      pattern = pattern.replace(/\[ \t\r\n\f\]/g, '\\s'); // Whitespace-Klasse
      
      // [a-zA-Z] → [a-z] nur wenn i-Flag aktiv (hier konservativ bleiben)
      // pattern = pattern.replace(/\[a-zA-Z\]/g, '[a-z]'); // deaktiviert - zu aggressiv

      // 3. Unnötige Gruppen entfernen
      pattern = pattern.replace(/\(\?:([^\(\)\|]{1})\)/g, '$1'); // (?:x) → x wenn nur 1 Zeichen
      pattern = pattern.replace(/\(\?:([^\(\)]+)\)\1/g, '$1');   // doppelte Gruppen
      
      // (?:...)? → (?:...)? bleibt, aber einfache Fälle: (?:a)? → a?
      pattern = pattern.replace(/\(\?:([^\(\)\|]{1})\)\?/g, '$1?');

      // 4. Leere Alternativen entfernen (aber vorsichtig)
      pattern = pattern.replace(/\|\|/g, '|'); // || → |
      pattern = pattern.replace(/^\|/, ''); // ^| → ^
      pattern = pattern.replace(/\|$/, ''); // |$ → $

      // 5. Doppelte Escapes bereinigen (nur wenn sicher)
      // pattern = pattern.replace(/\\\\/g, '\\'); // deaktiviert - kann zu Problemen führen

      // 6. Redundante Quantifier-Kombinationen
      pattern = pattern.replace(/\+\+/g, '+'); // ++ → +
      pattern = pattern.replace(/\*\*/g, '*'); // ** → *
      pattern = pattern.replace(/\?\?/g, '?'); // ?? → ?
      pattern = pattern.replace(/\+\?/g, '+'); // +? → + (possessive wird zu greedy)
      pattern = pattern.replace(/\*\?/g, '*'); // *? → *
      pattern = pattern.replace(/\?\?/g, '?'); // ?? → ?

      // 7. Leere Zeichenklassen entfernen (sollten nicht vorkommen, aber falls doch)
      pattern = pattern.replace(/\[\]/g, '[^]'); // [] → [^] (nicht-leere Klasse)

      // Anker wieder einsetzen
      if (hasStartAnchor) pattern = '^' + pattern;
      if (hasEndAnchor) pattern = pattern + '$';

      return pattern;
    },

    // Toast/Notification anzeigen
    showToast: function(message, type = 'success') {
      // Alten Toast entfernen falls vorhanden
      const existingToast = document.querySelector('.toast');
      if (existingToast) {
        existingToast.remove();
      }
      
      // Neuen Toast erstellen
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.setAttribute('role', 'alert');
      toast.setAttribute('aria-live', 'polite');
      toast.textContent = message;
      
      document.body.appendChild(toast);
      
      // Anzeigen
      setTimeout(() => {
        toast.classList.add('show');
      }, 10);
      
      // Nach 4 Sekunden ausblenden und entfernen
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 300);
      }, 4000);
    },
    handleTemplateClick: function(card) {
      if (!card) {
        return;
      }

      try {
        // Unterstütze sowohl data-examples als auch data-tpl
        const key = card.getAttribute('data-examples') || card.getAttribute('data-tpl');
        if (!key) {
          return;
        }
        
        // Prüfe zuerst in examples, dann in builderTemplates
        let tpl = APP.getExampleTemplateById(key);
        if (!tpl) {
          tpl = APP.getBuilderTemplateById(key);
        }
        
        if (!tpl) {
          const userFriendlyError = this.i18n?.userFriendlyErrors?.[this.state.lang]?.templateNotFound || 
                                    this.i18n?.userFriendlyErrors?.de?.templateNotFound ||
                                    'Diese Vorlage konnte nicht gefunden werden.';
          this.showToast(userFriendlyError, 'error');
          return;
        }

        // Deep Copy der parts mit Fehlerbehandlung
        try {
          this.state.parts = Array.isArray(tpl.parts)
            ? JSON.parse(JSON.stringify(tpl.parts)).map(p => {
                // Sicherstellen, dass alle Parts die notwendigen Flags haben
                return { ...p, configured: true, position: POSITION.ANYWHERE };
              })
            : [];
        } catch (e) {
          console.error('Fehler beim Kopieren der Parts:', e);
          this.state.parts = [];
        }

        this.state.testText = tpl.text || '';
        
        // Template Flags und Position übernehmen
        if (tpl.flags) {
          this.state.flags = { ...this.state.flags, ...tpl.flags };
        }
        if (tpl.position !== undefined) {
          this.state.position = tpl.position;
        } else {
          this.state.position = POSITION.ANYWHERE;
        }
        
        // Initialen Step basierend auf Parts-Status setzen
        try {
          this.state.step = this.getInitialStep();
        } catch (e) {
          console.error('Fehler beim Setzen des initialen Steps:', e);
          this.state.step = 'preview';
        }
        
        if (!Array.isArray(this.state.parts)) this.state.parts = [];
        this.state.view = 'builder';
        this.state.adding = false;

        this.render();
      } catch (error) {
        console.error('Fehler in handleTemplateClick:', error);
        const userFriendlyError = this.i18n?.userFriendlyErrors?.[this.state.lang]?.patternGenerationFailed || 
                                  this.i18n?.userFriendlyErrors?.de?.patternGenerationFailed ||
                                  'Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.';
        this.showToast(userFriendlyError, 'error');
      }
    },

    //
    bindStepClicks: function() {
        const self = this;
        // Entferne alte Event-Listener, bevor neue hinzugefügt werden
        document.querySelectorAll('.step-item[data-step]').forEach(el => {
            // Clone node to remove all event listeners
            const newEl = el.cloneNode(true);
            el.parentNode.replaceChild(newEl, el);
        });
        
        // Neue Event-Listener binden
        document.querySelectorAll('.step-item[data-step]').forEach(el => {
            if (el.dataset.bound === 'true') return;

            el.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const targetStep = el.dataset.step;
                const isInModal = el.closest('#snippet-modal') !== null;
                const isAllowed = isInModal 
                    ? self.isModalStepAllowed(targetStep)
                    : self.isStepAllowed(targetStep);
                
                if (self.steps[targetStep] && isAllowed) {
                    self.state.step = targetStep;
                    if (isInModal) {
                        self.renderSnippetModal(); // Re-render Modal
                    } else {
                        self.render(); // Re-render Builder
                    }
                } else {
                    self.showStepBlockedMessage(targetStep);
                }
            });
            
            // Keyboard support
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    el.click();
                }
            });

            el.dataset.bound = 'true';
        });
    },
    //
    showStepBlockedMessage: function(step) {
        const messages = {
        de: 'Bitte vorherige Schritte abschließen, bevor du fortfährst.',
        en: 'Please complete the previous steps before continuing.'
        };
        alert(messages[this.lang()] || messages.en);
    },

    //
    bindConfigEvents: function() {
      const cfg = this.state.partConfig || {};
      const part = this.state.newPart || {};
      const update = () => {
        part.config = { ...cfg };
        this.state.newPart = part;
        this.renderBuilderView();
      };

      document.querySelectorAll('#cfg-val, #cfg-min, #cfg-max, #delimiter-value, #cfg-choices, #whitelist-values, #blacklist-values, #cfg-whitelist, #cfg-blacklist').forEach(el => {
        el.addEventListener('input', update);
        el.addEventListener('change', update);
      });
      
      // Prüfmodus Buttons (data-mode) für numbers, letters, mixed, special
      document.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const mode = this.getAttribute('data-mode');
          
          // Alle Buttons in derselben Gruppe deaktivieren
          const group = this.closest('.selector-list');
          if (group) {
            group.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
          }
          this.classList.add('active');
          
          // Config aktualisieren
          if (!cfg) cfg = self.state.partConfig = self.state.partConfig || {};
          cfg.mode = mode;
          
          // Live-Preview aktualisieren
          update();
        });
      });

      document.querySelectorAll('[data-case]').forEach(btn => {
        btn.addEventListener('click', () => {
          cfg.caseMode = btn.getAttribute('data-case');
          update();
        });
      });

      document.querySelectorAll('[data-toggle="caseSensitive"]').forEach(cb => {
        cb.addEventListener('change', () => {
          cfg.caseSensitive = cb.checked;
          update();
        });
      });
    },

    bindFixButtons: function() {

    bindConfirmAdd: function() {
      const confirmBtn = document.getElementById('confirm-add-btn');
      if (!confirmBtn) return;

      confirmBtn.setAttribute('role', 'button');
      confirmBtn.setAttribute('tabindex', '0');
      confirmBtn.setAttribute('aria-label', this.t('add'));

      const confirm = () => {
        const newPart = this.buildConfiguredPart(); // z. B. aus Formfeldern
        if (newPart) {
          this.state.parts.push(newPart);
          this.state.adding = false;
          this.render();
        } else {
          alert(this.t('validText')); // oder andere Validierung
        }
      };

      confirmBtn.addEventListener('click', confirm);

          e.preventDefault();
          confirm();
        }
      });

    //
    buildConfiguredPart: function() {
      const cfg = this.state.partConfig;
      if (!cfg || !cfg.type) return null;

      const part = { type: cfg.type };

      // 🔹 Optional-Flag
      if (cfg.isOptional) part.isOptional = true;

      // 🔹 Groß-/Kleinschreibung
      if (cfg.caseMode) part.caseMode = cfg.caseMode;

      switch (cfg.type) {
        case 'text':
          if (!cfg.value || typeof cfg.value !== 'string' || cfg.value.trim() === '') return null;
          part.value = cfg.value.trim();
          break;

        case 'numbers':
          if (cfg.min == null || isNaN(cfg.min)) return null;
          part.min = parseInt(cfg.min);
          if (cfg.max != null && !isNaN(cfg.max)) part.max = parseInt(cfg.max);
          break;

        case 'letters':
        case 'mixed':
          if (!Array.isArray(cfg.chars) || cfg.chars.length === 0) return null;
          part.chars = cfg.chars;
          if (cfg.min != null && !isNaN(cfg.min)) part.min = parseInt(cfg.min);
          if (cfg.max != null && !isNaN(cfg.max)) part.max = parseInt(cfg.max);
          break;

        case 'choice':
          if (!Array.isArray(cfg.values) || cfg.values.length < 2) return null;
          part.values = cfg.values.map(v => v.trim()).filter(v => v);
          break;

          case 'regex':
          if (!cfg.pattern || typeof cfg.pattern !== 'string') return null;
          part.pattern = cfg.pattern;
          break;

        default:
          return null;
      }

      return part;
    },

    //  
    bindRegexPreviewClick: function() {
      const previewEl = document.getElementById('regex-preview');
      if (!previewEl || previewEl.dataset.bound) return;

      // 🔹 Barrierefreiheit
      previewEl.setAttribute('role', 'button');
      previewEl.setAttribute('tabindex', '0');
      previewEl.setAttribute('aria-label', this.t('copyPatternLabel')); // z. B. "RegEx kopieren"

      const feedbackEl = document.getElementById('copy-feedback');

      const copyToClipboard = () => {
        const pattern = this.genPattern().source || '';
        let success = false;

        // 🔹 Moderner Weg
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(pattern).then(() => {
            success = true;
            showFeedback(success);
          }).catch(() => {
            showFeedback(false);
            alert(pattern); // Fallback
          });
        } else {
          // 🔹 Fallback für ältere Browser
          const ta = document.createElement('textarea');
          ta.value = pattern;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try {
            success = document.execCommand('copy');
          } catch (e) {
          }
          document.body.removeChild(ta);
          showFeedback(success);
          if (!success) alert(pattern);
        }
      };

      const showFeedback = (success) => {
        if (!feedbackEl) return;
        feedbackEl.textContent = success ? this.t('copied') : this.t('copyFailed');
        feedbackEl.classList.add('visible');
        previewEl.classList.add(success ? 'copied' : 'copy-error');
        setTimeout(() => {
          feedbackEl.classList.remove('visible');
          previewEl.classList.remove('copied', 'copy-error');
        }, 1500);
      };

      // 🔹 Klick
      previewEl.addEventListener('click', copyToClipboard);

      // 🔹 Tastatur
      previewEl.addEventListener('keydown', e => {

          copyToClipboard();
        }
      });

      previewEl.dataset.bound = '1';

    //
    copyToClipboard: function(text, feedbackEl, previewEl) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();

      let success = false;
      try {
        success = document.execCommand('copy');
      } catch (e) {
        // Copy failed - silently handle error
      }
      document.body.removeChild(ta);

      if (feedbackEl) {
        feedbackEl.textContent = success ? this.t('copied') : this.t('copyFailed');
        feedbackEl.classList.add('visible');
        previewEl.classList.add(success ? 'copied' : 'copy-error');

        setTimeout(() => {
          feedbackEl.classList.remove('visible');
          previewEl.classList.remove('copied', 'copy-error');
        }, 1500);
      }

      if (!success) alert(text);
    },

    // Aktualisiert nur die Test-Sektion ohne vollständiges Re-Render
    updateTestSection: function() {
      const testContainer = document.querySelector('.live-preview-test');
      if (!testContainer) return;
      
      // Finde den Matches-Container (kann direkt nach testContainer sein oder in einem Alert)
      let matchesContainer = testContainer.nextElementSibling;
      // Falls nextElementSibling kein Alert ist, suche nach dem Alert-Container
      if (!matchesContainer || !matchesContainer.classList.contains('alert')) {
        matchesContainer = testContainer.parentElement?.querySelector('.alert');
      }
      
      const testText = this.state.testText || '';
      const regex = this.genPattern();
      
      let matches = [];
      try {
        matches = testText.match(regex) || [];
      } catch (e) {
        matches = [];
      }
      
      this.state.matches = matches;
      
      // Highlighting
      let highlighted = this.esc(testText);
      if (matches.length > 0) {
        matches.forEach(m => {
          const matchStr = typeof m === 'string' ? m : (Array.isArray(m) ? m[0] : null);
          if (typeof matchStr === 'string' && matchStr.length < 10000) {
            try {
              const escMatch = this.esc(matchStr);
              const regex = new RegExp(this.escRegex(matchStr), 'g');
              highlighted = highlighted.replace(regex, '<mark>' + escMatch + '</mark>');
            } catch (e) {
              // Fehler beim Highlighting ignorieren
            }
          }
        });
      }
      
      // Test-Container aktualisieren
      testContainer.innerHTML = highlighted;
      
      // Matches-Container aktualisieren oder erstellen
      const t = this.t.bind(this);
      if (matchesContainer && matchesContainer.classList.contains('alert')) {
        // Bestehenden Container aktualisieren
        if (matches.length > 0) {
          matchesContainer.className = 'alert alert-success';
          matchesContainer.innerHTML = '✔ ' + matches.length + ' ' + t('matches');
        } else if (testText) {
          matchesContainer.className = 'alert alert-error';
          matchesContainer.innerHTML = '✗ ' + t('noMatches');
        } else {
          matchesContainer.innerHTML = '';
        }
      } else if (testContainer.parentElement) {
        // Neuen Container erstellen falls nicht vorhanden
        if (matches.length > 0 || testText) {
          const newAlert = document.createElement('div');
          newAlert.className = matches.length > 0 ? 'alert alert-success' : 'alert alert-error';
          newAlert.innerHTML = matches.length > 0 
            ? '✔ ' + matches.length + ' ' + t('matches')
            : '✗ ' + t('noMatches');
          testContainer.parentElement.appendChild(newAlert);
        }
      }
    },

          const value = input.value;
          const regex = this.buildRegexForCurrentPart?.();
          if (!value) {
            preview.textContent = '';

          }
          if (!regex) {
            preview.innerHTML = '<span class="match-fail">' +
              (this.state.lang === 'de' ? 'Kein Muster verfügbar.' : 'No pattern available.') +
              '</span>';
            return;
          }

          const match = regex.exec(value);
          if (match) {
            let html = '<mark>' + this.esc(match[0]) + '</mark>';

            if (match.groups && Object.keys(match.groups).length > 0) {
              html += '<div class="group-output">';
              for (const [name, val] of Object.entries(match.groups)) {
                html += `<div class="group-line"><strong>${this.esc(name)}:</strong> ${this.esc(val)}</div>`;
              }
              html += '</div>';
            }

            preview.innerHTML = html;
          } else {
            preview.innerHTML = '<span class="match-fail">' + APP.t('noMatches') + '</span>';
          }
        };
      }
    },

    // --- Part-Erzeugung ---
    makePart: function(type, cfg) {
        const hasCfg = cfg && typeof cfg === 'object';
        if (!hasCfg) {
          // Fallback: Standardteile erstellen (kompatibel zu früherer Signatur makePart(kind))
          switch (type) {
            case 'text':      return { type: 'text', value: '' };
            case 'numbers':   return { type: 'numbers', min: 1, max: '', whitelist: [], blacklist: [], mode: 'term' };
            case 'letters':   return { type: 'letters', min: 1, max: '', whitelist: [], blacklist: [], mode: 'term' };
            case 'mixed':     return { type: 'mixed', min: 1, max: '', extraChars: '.,:/€$', whitelist: [], blacklist: [], mode: 'term' };
            case 'special':   return { type: 'special', min: 1, max: '', whitelist: [], blacklist: [], mode: 'term' };
            case 'choice':    return { type: 'choice', choices: [] };
            case 'delimiter': return { type: 'delimiter', value: '', whitelist: [], blacklist: [], mode: 'term' };
            case 'whitelist': return { type: 'whitelist', values: [], mode: 'term' };
            case 'blacklist': return { type: 'blacklist', values: [], mode: 'term' };
            default:          return null;
          }
        }
        const c = cfg || {};
        switch (type) {
          case 'text':
          return {
              type: 'text',
            value: c.value || ''
          };

          case 'choice':
          return {
              type: 'choice',
            choices: c.choices || []
          };

          case 'delimiter':
          return {
              type: 'delimiter',
            value: c.value || '',
            whitelist: c.whitelist || [],
            blacklist: c.blacklist || [],
            mode: c.mode || 'term'
          };

          case 'whitelist':
          return {
              type: 'whitelist',
            values: c.values || [],
            mode: c.mode || 'term'
          };

          case 'blacklist':
          return {
              type: 'blacklist',
            values: c.values || [],
            mode: c.mode || 'term'
          };

        case 'numbers':
          return {
            type: 'numbers',
            min: c.min || 1,
            max: c.max || '',
            whitelist: c.whitelist || [],
            blacklist: c.blacklist || [],
            mode: c.mode || 'char'  // Standard-Mode auf 'char' setzen (nicht 'term')
          };

        case 'letters':
          return {
            type: 'letters',
            min: c.min || 1,
            max: c.max || '',
            whitelist: c.whitelist || [],
            blacklist: c.blacklist || [],
            mode: c.mode || 'char',  // Standard-Mode auf 'char' setzen (nicht 'term')
            caseMode: c.caseMode || 'any'
          };

        case 'mixed':
          return {
            type: 'mixed',
            min: c.min || 1,
            max: c.max || '',
            extraChars: c.extraChars || '.,:/€$',
            whitelist: c.whitelist || [],
            blacklist: c.blacklist || [],
            mode: c.mode || 'char',  // Standard-Mode auf 'char' setzen (nicht 'term')
            caseMode: c.caseMode || 'any'
          };

        case 'special':
          return {
            type: 'special',
            min: c.min || 1,
            max: c.max || '',
            whitelist: c.whitelist || [],
            blacklist: c.blacklist || [],
            mode: c.mode || 'char'  // Standard-Mode auf 'char' setzen (nicht 'term')
          };

        default:
          return null;
        }
    },
    //      
    testPart: function(type, cfg, val) {
      if (!val) return false;

      switch (type) {
        case 'choice':
          const choices = Array.isArray(cfg.choices) ? cfg.choices : (Array.isArray(cfg.values) ? cfg.values : []);
          if (choices.length === 0) return false;
          // Trim Whitespace und vergleiche case-insensitive
          const trimmedVal = val.trim();
          return choices.some(c => c.trim().toLowerCase() === trimmedVal.toLowerCase());

        case 'whitelist':
          if (!cfg.values) return false;
          if (cfg.mode === 'char') {
            return [...val].every(ch => cfg.values.includes(ch));
          } else if (cfg.mode === 'term') {
            return cfg.values.includes(val);
          }
          return false;

        case 'blacklist':
          if (!cfg.values) return true;
          if (cfg.mode === 'char') {
            return ![...val].some(ch => cfg.values.includes(ch));
          } else if (cfg.mode === 'term') {
            return !cfg.values.includes(val);
          } else if (cfg.mode === 'contains') {
            return !cfg.values.some(v => val.includes(v));
          }
          return true;

        case 'numbers':
        case 'letters':
        case 'mixed':
        case 'special':
        case 'delimiter':
          if (!this.checkType(type, val, cfg)) return false;
          if (!this.checkLength(cfg, val)) return false;
          return this.checkWLBL(cfg, val);

        default:
          return true;
      }
    },

    buildRegexForCurrentPart: function() {
      // Aktuelle Config aus Formular lesen (falls verfügbar), sonst state verwenden
      let p = {};
      if (this.readConfig && typeof this.readConfig === 'function') {
        try {
          p = this.readConfig() || this.state.partConfig || {};
        } catch (e) {
          p = this.state.partConfig || {};
        }
      } else {
        p = this.state.partConfig || {};
      }
      
      const pt = this.state.partType;
      if (!pt) return null;
      
      // Wenn customPattern vorhanden ist, verwende dieses direkt
      if (p.customPattern) {
        return { source: p.customPattern, flags: '' };
      }

      let base = '';

      // --- Grundmuster je nach Typ ---
      switch (pt) {
        case 'text': {
          base = this.escRegex(p.value || '');
          break;
        }

        case 'numbers': {
          // Quantifier-Mode beachten
          let quantifier = '';
          if (p.quantifierMode === 'optional') {
            quantifier = '?';
          } else if (p.quantifierMode === 'zeroOrMore') {
            quantifier = '*';
          } else if (p.quantifierMode === 'oneOrMore') {
            quantifier = '+';
          } else {
            // Custom-Modus: Min/Max verwenden
            const min = p.min || 1;
            const max = p.max ? ',' + p.max : '';
            quantifier = `{${min}${max}}`;
          }
          base = `[0-9]${quantifier}`;
          break;
        }

        case 'letters': {
          // Quantifier-Mode beachten
          let quantifier = '';
          if (p.quantifierMode === 'optional') {
            quantifier = '?';
          } else if (p.quantifierMode === 'zeroOrMore') {
            quantifier = '*';
          } else if (p.quantifierMode === 'oneOrMore') {
            quantifier = '+';
          } else {
            // Custom-Modus: Min/Max verwenden
            const min = p.min || 1;
            const max = p.max ? ',' + p.max : '';
            quantifier = `{${min}${max}}`;
          }
          
          // Case-Mode direkt in Character-Class anwenden
          if (p.caseMode === 'lower') {
            base = `[a-z]${quantifier}`;
          } else if (p.caseMode === 'upper') {
            base = `[A-Z]${quantifier}`;
          } else {
            base = `[A-Za-z]${quantifier}`;
          }
          break;
        }

        case 'mixed': {
          const extra = p.extraChars || '.,:/€$';
          // Quantifier-Mode beachten
          let quantifier = '';
          if (p.quantifierMode === 'optional') {
            quantifier = '?';
          } else if (p.quantifierMode === 'zeroOrMore') {
            quantifier = '*';
          } else if (p.quantifierMode === 'oneOrMore') {
            quantifier = '+';
          } else {
            // Custom-Modus: Min/Max verwenden
            const min = p.min || 1;
            const max = p.max ? ',' + p.max : '';
            quantifier = `{${min}${max}}`;
          }
          
          // Case-Mode direkt in Character-Class anwenden
          if (p.caseMode === 'lower') {
            base = `[a-z0-9${this.escRegex(extra)}]${quantifier}`;
          } else if (p.caseMode === 'upper') {
            base = `[A-Z0-9${this.escRegex(extra)}]${quantifier}`;
          } else {
            base = `[A-Za-z0-9${this.escRegex(extra)}]${quantifier}`;
          }
          break;
        }

        case 'choice': {
          if (p.choices?.length > 0) {
            base = '(?:' + p.choices.map(this.escRegex).join('|') + ')';
          }
          break;
        }

        case 'delimiter': {
          base = this.escRegex(p.value || ',');
          break;
        }

        case 'special': {
          // Quantifier-Mode beachten
          let quantifier = '';
          if (p.quantifierMode === 'optional') {
            quantifier = '?';
          } else if (p.quantifierMode === 'zeroOrMore') {
            quantifier = '*';
          } else if (p.quantifierMode === 'oneOrMore') {
            quantifier = '+';
          } else {
            // Custom-Modus: Min/Max verwenden
            const min = p.min || 1;
            const max = p.max ? ',' + p.max : '';
            quantifier = `{${min}${max}}`;
          }
          base = `[^A-Za-z0-9]${quantifier}`;
          break;
        }

        case 'whitelist':
        case 'blacklist': {
          // Diese Typen werden direkt in genPattern() verarbeitet
          return null;
        }

        default:
          return null;
      }

      // --- Whitelist / Blacklist ---
      let pattern = this.applyWLBL(p, base);

      // --- Optional-Markierung ---
      if (p.isOptional) {
        pattern = '(?:' + pattern + ')?';
      }

      // --- Positionslogik ---
      switch (this.state.position) {
        case POSITION.START:
          pattern = '^' + pattern;
          break;
        case POSITION.END:
          pattern = pattern + '$';
          break;
        case POSITION.FULL:
          pattern = '^' + pattern + '$';
          break;
        case POSITION.WORD_BOUNDARY:
          pattern = '\\b' + pattern;
          break;
        case POSITION.NON_WORD_BOUNDARY:
          pattern = '\\B' + pattern;
          break;
        // POSITION.ANYWHERE → keine Änderung
      }

      // --- Regex erzeugen ---
      try {
        return new RegExp(pattern);
      } catch (e) {
        return null;
      }
    },

    initFontSizeControls: function() {
      const sizes = ['font-normal', 'font-large', 'font-xlarge'];
      const classMap = {
        'font-normal': '',
        'font-large': FONT_SIZE.LARGE,
        'font-xlarge': FONT_SIZE.XLARGE
      };

      sizes.forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.onclick = () => {
            // Entferne vorherige Größenklassen
            document.body.classList.remove(FONT_SIZE.LARGE, FONT_SIZE.XLARGE);
            // Füge neue hinzu (außer bei "normal")
            if (classMap[id]) {
              document.body.classList.add(classMap[id]);
            }
          };
        }
      });
    },
    //
    initLanguageControls: function() {
      const self = this;

      // Sprachumschalter initialisieren
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const newLang = e.currentTarget.getAttribute('data-lang');
          if (!newLang || newLang === self.state.lang) return;

          self.state.lang = newLang;
          document.documentElement.setAttribute('lang', newLang);

          // Aktive Klasse aktualisieren
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          e.currentTarget.classList.add('active');

          // Modale Texte aktualisieren
          const t = self.i18n[newLang];
          document.getElementById("modal-cancel").textContent = t.cancel;
          document.getElementById("modal-confirm").textContent = t.confirm;
          document.getElementById("legal-close").textContent = t.close;
          document.getElementById("legal-modal-title").textContent = t.titImpressum;

          // UI neu rendern
          self.render();
          self.initUI();
          self.attachHeaderEvents?.();
          this.initLanguageControls();
          self.attachWelcomeEvents?.();
          self.bindEvents?.();

        });
      });
    },
    //
    initThemeControls: function() {
      const themeBtn = document.getElementById('theme-btn');
      if (!themeBtn) return;

      themeBtn.onclick = () => {
        const current = this.state.theme || document.documentElement.getAttribute('data-theme') || 'light';
        const next = current === 'dark' ? 'light' : 'dark';

        this.state.theme = next;
        this.setLocalStorage('theme', next);
        this.updateThemeUI(next);
      };
    },

    //  
    initModalControls: function() {
      const self = this;

      document.getElementById('modal-cancel').onclick = () => self.hideConfirm();
      document.getElementById('modal-confirm').onclick = () => {
        if (self.state.confirmCb) self.state.confirmCb();
      };

      document.getElementById('confirm-modal').onclick = function(e) {
        if (e.target === this) self.hideConfirm();
      };
      document.getElementById('legal-modal').onclick = function(e) {
        if (e.target === this) self.hideLegal();
      };
      const snippetModal = document.getElementById('snippet-modal');
      if (snippetModal) {
        // Alten Event-Handler entfernen falls vorhanden
        const newHandler = snippetModal.onclick;
        snippetModal.onclick = null;
        snippetModal.removeEventListener('click', newHandler);
        
        // Neuen Event-Handler hinzufügen
        snippetModal.addEventListener('click', function(e) {
          // Nur schließen wenn wirklich auf den Hintergrund geklickt wurde (nicht auf Kind-Elemente)
          // Das Modal-Element selbst ist der Hintergrund, modal-content ist das Kind
          const modalContent = snippetModal.querySelector('.modal-content');
          if (e.target === snippetModal && (!modalContent || !modalContent.contains(e.target))) {
            self.closeSnippetModal();
          }
        }, { once: false });
      }
    },
    //
    initGlobalShortcuts: function() {
      const self = this;
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          if (document.getElementById('confirm-modal').classList.contains('active')) self.hideConfirm();
          if (document.getElementById('legal-modal').classList.contains('active')) self.hideLegal();
          if (document.getElementById('snippet-modal').classList.contains('active')) self.closeSnippetModal();
        }
      });
    },

    attachGlobalEvents: function() {
      const legalClose = document.getElementById('legal-close');
      if (legalClose && !legalClose.dataset.bound) {
        legalClose.onclick = () => {
          document.getElementById('legal-modal')?.classList.remove('active');
        };
        legalClose.dataset.bound = '1';
      }
    },
