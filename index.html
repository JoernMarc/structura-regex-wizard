    //  
    getDiagnosticInfo: function() {
      const lang = this.lang();
      const info = [];
      const pattern = this.genPattern();
      const source = pattern.source || '';
      const flags = pattern.flags || '';
      const parts = this.state.parts || [];
      const matches = this.state.matches || [];

      const messages = {
        empty: { type: 'error', icon: '⚠️', de: 'Das Muster ist leer. Bitte mindestens einen Teil hinzufügen.', en: 'Pattern is empty. Please add at least one part.'  },
        noMatch: { type: 'warning', icon: '✗', de: 'Kein Treffer im Testtext. Prüfe Position, Flags oder Teilstruktur.', en: 'No match in test text. Check position, flags or part structure.' },
        singlePart: { type: 'tip', icon: '💡', de: 'Nur ein Teil aktiv. Kombinierte Muster sind oft aussagekräftiger.', en: 'Only one part active. Combined patterns are often more expressive.' },
        backtrack: { type: 'warning', icon: '⚠️', de: 'Mögliches Backtracking-Risiko durch verschachtelte Wiederholungen.', en: 'Possible backtracking risk due to nested repetitions.' },
        noPosition: { type: 'tip', icon: '💡', de: 'Keine Position gewählt. ^ und $ können das Verhalten stark beeinflussen.', en: 'No position set. ^ and $ can strongly affect behavior.'},
        complexPattern: { type: 'info', icon: '📊', de: 'Komplexes Pattern erkannt. Bei großen Texten könnte die Ausführung langsamer sein.', en: 'Complex pattern detected. Execution might be slower on large texts.' },
        redundantGroup: { type: 'tip', icon: '🔧', de: 'Unnötige Gruppen gefunden. Können vereinfacht werden.', en: 'Unnecessary groups found. Can be simplified.' },
        longPattern: { type: 'info', icon: '📏', de: 'Langes Pattern. Erwägen Sie, es in kleinere Teile aufzuteilen.', en: 'Long pattern. Consider breaking it into smaller parts.' },
        noQuantifier: { type: 'tip', icon: '💡', de: 'Einzelne Zeichen ohne Quantifier. Erwägen Sie {1} oder + für Klarheit.', en: 'Single characters without quantifier. Consider {1} or + for clarity.' },
        nestedOptional: { type: 'warning', icon: '⚠️', de: 'Verschachtelte optionale Gruppen können zu unerwarteten Ergebnissen führen.', en: 'Nested optional groups can lead to unexpected results.' },
        emptyCharClass: { type: 'error', icon: '❌', de: 'Leere Zeichenklasse [] gefunden. Dies ist ungültig.', en: 'Empty character class [] found. This is invalid.' },
        inefficientQuantifier: { type: 'tip', icon: '🔧', de: 'Quantifier {0,} kann als * geschrieben werden (kürzer).', en: 'Quantifier {0,} can be written as * (shorter).' },
        inefficientQuantifier1: { type: 'tip', icon: '🔧', de: 'Quantifier {1,} kann als + geschrieben werden (kürzer).', en: 'Quantifier {1,} can be written as + (shorter).' },
        inefficientQuantifier01: { type: 'tip', icon: '🔧', de: 'Quantifier {0,1} kann als ? geschrieben werden (kürzer).', en: 'Quantifier {0,1} can be written as ? (shorter).' },
        manyAlternatives: { type: 'warning', icon: '⚡', de: 'Viele Alternativen (|) gefunden. Bei vielen Optionen kann die Performance leiden.', en: 'Many alternatives (|) found. Performance may suffer with many options.' },
        manyGroups: { type: 'info', icon: '📦', de: 'Viele Gruppen gefunden. Prüfen Sie, ob alle Gruppen notwendig sind.', en: 'Many groups found. Check if all groups are necessary.' },
        manyQuantifiers: { type: 'info', icon: '🔢', de: 'Viele Quantifier gefunden. Könnte die Performance bei großen Texten beeinträchtigen.', en: 'Many quantifiers found. May impact performance on large texts.' },
        deeplyNested: { type: 'warning', icon: '⚠️', de: 'Stark verschachtelte Strukturen erkannt. Erhöhtes Backtracking-Risiko.', en: 'Deeply nested structures detected. Increased backtracking risk.' },
        greedyQuantifier: { type: 'tip', icon: '💡', de: 'Greedy Quantifier (*, +) verwendet. Bei Bedarf können Sie lazy Quantifier (*?, +?) verwenden.', en: 'Greedy quantifier (*, +) used. Consider lazy quantifiers (*?, +?) if needed.' },
        unescapedSpecial: { type: 'warning', icon: '⚠️', de: 'Möglicherweise unescapte Sonderzeichen gefunden. Prüfen Sie auf . ^ $ * + ? { } [ ] \\ | ( )', en: 'Possibly unescaped special characters found. Check for . ^ $ * + ? { } [ ] \\ | ( )' },
        invalidRange: { type: 'error', icon: '❌', de: 'Ungültiger Zeichenbereich in Zeichenklasse gefunden (z.B. [z-a]).', en: 'Invalid character range in character class found (e.g. [z-a]).' },
        missingClosing: { type: 'error', icon: '❌', de: 'Möglicherweise fehlende schließende Klammer oder eckige Klammer.', en: 'Possibly missing closing parenthesis or bracket.' },
        catastrophicBacktrack: { type: 'error', icon: '🚨', de: 'Kritisches Backtracking-Risiko erkannt! Pattern könnte bei großen Texten sehr langsam sein.', en: 'Critical backtracking risk detected! Pattern may be very slow on large texts.' },
        unoptimizedCharClass: { type: 'tip', icon: '🔧', de: '[0-9] kann als \\d geschrieben werden (kürzer und lesbarer).', en: '[0-9] can be written as \\d (shorter and more readable).' },
        unoptimizedWordClass: { type: 'tip', icon: '🔧', de: '[a-zA-Z0-9_] kann als \\w geschrieben werden (kürzer und lesbarer).', en: '[a-zA-Z0-9_] can be written as \\w (shorter and more readable).' },
        unoptimizedSpaceClass: { type: 'tip', icon: '🔧', de: '[ \\t\\r\\n\\f] kann als \\s geschrieben werden (kürzer).', en: '[ \\t\\r\\n\\f] can be written as \\s (shorter).' },
        inefficientAlternation: { type: 'tip', icon: '💡', de: 'Bei vielen kurzen Alternativen könnten Zeichenklassen effizienter sein.', en: 'For many short alternatives, character classes might be more efficient.' },
        manyOptionalParts: { type: 'info', icon: '📊', de: 'Viele optionale Teile gefunden. Kann zu unerwarteten Matches führen.', en: 'Many optional parts found. May lead to unexpected matches.' },
        missingAnchors: { type: 'tip', icon: '💡', de: 'Für exakte Matches sollten Sie ^ und $ verwenden (Position: "Ganzer Text").', en: 'For exact matches, you should use ^ and $ (Position: "Full line").' },
        redundantEscape: { type: 'tip', icon: '🔧', de: 'Überflüssige Escapes gefunden. Einige Zeichen müssen nicht escaped werden.', en: 'Redundant escapes found. Some characters don\'t need to be escaped.' },
        performanceRisk: { type: 'warning', icon: '⚡', de: 'Pattern könnte bei sehr großen Texten (>10.000 Zeichen) langsam sein.', en: 'Pattern may be slow on very large texts (>10,000 characters).' }
      };

      if (source === '') {
        const m = messages.empty;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
        return info;
      }

      // Pattern-Komplexität analysieren
      const complexity = this.analyzePatternComplexity(source);
      
      // Komplexitäts-Hinweise
      if (complexity.score > 50) {
        const m = messages.complexPattern;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      if (source.length > 200) {
        const m = messages.longPattern;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Leere Zeichenklasse prüfen
      if (/\[\]/.test(source)) {
        const m = messages.emptyCharClass;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Redundante Gruppen
      if (/\(\?:[^\(\)\|]{1}\)/.test(source)) {
        const m = messages.redundantGroup;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Verschachtelte optionale Gruppen
      if (/\(\?:.*\?\)/.test(source) && /\(\?:.*\?\)/.test(source.replace(/\(\?:.*\?\)/, ''))) {
        const m = messages.nestedOptional;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Ineffiziente Quantifier
      if (/\{0,\}/.test(source)) {
        const m = messages.inefficientQuantifier;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }
      if (/\{1,\}/.test(source)) {
        const m = messages.inefficientQuantifier1;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }
      if (/\{0,1\}/.test(source)) {
        const m = messages.inefficientQuantifier01;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Testtext-Hinweise
      if (this.state.testText && matches.length === 0) {
        const m = messages.noMatch;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Struktur-Hinweise
      if (parts.length === 1) {
        const m = messages.singlePart;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Backtracking-Risiko
      if (/\(.+\)\+/.test(source)) {
        const m = messages.backtrack;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Position-Hinweise
      if (!this.state.position) {
        const m = messages.noPosition;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Performance-Hinweise basierend auf Komplexität
      if (complexity.alternations > 10) {
        const m = messages.manyAlternatives;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      if (complexity.groups > 8) {
        const m = messages.manyGroups;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      if (complexity.quantifiers > 10) {
        const m = messages.manyQuantifiers;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      if (complexity.nested > 3) {
        const m = messages.deeplyNested;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Performance-Risiko bei sehr komplexen Patterns
      if (complexity.score > 100) {
        const m = messages.performanceRisk;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Greedy Quantifier Hinweis
      if (/[\*\+]/.test(source) && !/[\*\+]\?/.test(source)) {
        // Prüfe ob lazy quantifiers verwendet werden, wenn nicht, zeige Hinweis
        if (!source.includes('*?') && !source.includes('+?')) {
          const m = messages.greedyQuantifier;
          info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
        }
      }

      // Katastrophales Backtracking erkennen (z.B. (.*)+ oder (.+)+)
      if (/\(\.\*\)\+/.test(source) || /\(\.\+\)\+/.test(source) || /\(\.\{[^}]+\}\)\+/.test(source)) {
        const m = messages.catastrophicBacktrack;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Optimierungs-Hinweise für Zeichenklassen
      if (/\[0-9\]/.test(source)) {
        const m = messages.unoptimizedCharClass;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      if (/\[a-zA-Z0-9_\]/.test(source)) {
        const m = messages.unoptimizedWordClass;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      if (/\[ \t\r\n\f\]/.test(source)) {
        const m = messages.unoptimizedSpaceClass;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Viele optionale Teile erkennen
      const optionalMatches = (source.match(/\?/g) || []).length;
      if (optionalMatches > 5) {
        const m = messages.manyOptionalParts;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Ungültige Zeichenbereiche in Zeichenklassen erkennen (z.B. [z-a])
      if (/\[[^\]]*-[^\]]*\]/.test(source)) {
        const rangeMatches = source.match(/\[[^\]]*-[^\]]*\]/g) || [];
        for (let i = 0; i < rangeMatches.length; i++) {
          const rangeMatch = rangeMatches[i];
          const rangeParts = rangeMatch.match(/([a-zA-Z0-9])-([a-zA-Z0-9])/);
          if (rangeParts && rangeParts.length >= 3) {
            const start = rangeParts[1].charCodeAt(0);
            const end = rangeParts[2].charCodeAt(0);
            if (start > end) {
              const m = messages.invalidRange;
              info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
              break;
            }
          }
        }
      }

      // Fehlende schließende Klammern prüfen (einfache Balance-Check)
      const openParens = (source.match(/\(/g) || []).length;
      const closeParens = (source.match(/\)/g) || []).length;
      const openBrackets = (source.match(/\[/g) || []).length;
      const closeBrackets = (source.match(/\]/g) || []).length;
      if (openParens !== closeParens || openBrackets !== closeBrackets) {
        const m = messages.missingClosing;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      // Ineffiziente Alternativen erkennen (viele kurze Alternativen könnten Zeichenklasse sein)
      if (complexity.alternations > 5) {
        const altPattern = /\([^)]*\|[^)]*\)/g;
        const altMatches = source.match(altPattern) || [];
        for (let i = 0; i < altMatches.length; i++) {
          const alt = altMatches[i];
          const altParts = alt.split('|');
          // Wenn viele einzelne Zeichen alterniert werden, könnte Zeichenklasse besser sein
          if (altParts.length > 8 && altParts.every(p => p.trim().length === 1 || p.trim().length === 2 && p.trim().startsWith('\\'))) {
            const m = messages.inefficientAlternation;
            info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
            break;
          }
        }
      }

      // Fehlende Anker für exakte Matches
      if (!source.startsWith('^') && !source.startsWith('$') && this.state.testText && matches.length > 0) {
        // Wenn Pattern matched, aber nicht an Position beginnt/endet, könnte Anker helfen
        const m = messages.missingAnchors;
        info.push({ type: m.type, message: lang === 'de' ? `${m.icon} ${m.de}` : `${m.icon} ${m.en}` });
      }

      return info;
    },
    // Pattern-Komplexität analysieren (offline)
    analyzePatternComplexity: function(pattern) {
      let score = 0;
      
      // Länge
      score += Math.min(pattern.length / 10, 20);
      
      // Anzahl der Alternativen (|)
      const alternations = (pattern.match(/\|/g) || []).length;
      score += alternations * 2;
      
      // Anzahl der Gruppen
      const groups = (pattern.match(/\(/g) || []).length;
      score += groups * 1.5;
      
      // Anzahl der Quantifier
      const quantifiers = (pattern.match(/[\?\*\+\{\}]/g) || []).length;
      score += quantifiers * 1;
      
      // Verschachtelte Strukturen
      const nested = pattern.match(/\([^\)]*\(/g) || [];
      score += nested.length * 3;
      
      return {
        score: Math.round(score),
        length: pattern.length,
        alternations: alternations,
        groups: groups,
        quantifiers: quantifiers,
        nested: nested.length
      };
    },

    showTutorial: function() {
      const modal = document.getElementById('tutorial-modal');
      if (!modal) return;
      
      this.state.tutorialStep = 0;
      this.renderTutorial();
      modal.classList.add('active');
      
      // Event-Handler nach dem Rendern binden
      setTimeout(() => {
        this.bindTutorialEvents();
      }, 100);
    },
    hideTutorial: function() {
      const modal = document.getElementById('tutorial-modal');
      if (!modal) return;
      
      const dontShow = document.getElementById('tutorial-dont-show')?.checked;
      if (dontShow) {
        this.setLocalStorage('tutorial-completed', 'true');
      }
      
      modal.classList.remove('active');
      this.state.tutorialStep = 0;
    },
    renderTutorial: function() {
      const lang = this.state.lang;
      const step = this.state.tutorialStep || 0;
      const steps = [
        { title: this.t('tutorialStep1Title'), text: this.t('tutorialStep1Text') },
        { title: this.t('tutorialStep2Title'), text: this.t('tutorialStep2Text') },
        { title: this.t('tutorialStep3Title'), text: this.t('tutorialStep3Text') },
        { title: this.t('tutorialStep4Title'), text: this.t('tutorialStep4Text') }
      ];
      
      const titleEl = document.getElementById('tutorial-title');
      const contentEl = document.getElementById('tutorial-content');
      const progressEl = document.getElementById('tutorial-progress');
      const prevBtn = document.getElementById('tutorial-prev');
      const nextBtn = document.getElementById('tutorial-next');
      const skipBtn = document.getElementById('tutorial-skip');
      const finishBtn = document.getElementById('tutorial-finish');
      const dontShowLabel = document.getElementById('tutorial-dont-show-label');
      
      if (titleEl) titleEl.textContent = this.t('tutorialTitle');
      if (dontShowLabel) dontShowLabel.textContent = this.t('tutorialDontShowAgain');
      
      // Progress dots
      if (progressEl) {
        progressEl.innerHTML = steps.map((_, i) => 
          `<div class="tutorial-progress-dot ${i === step ? 'active' : ''}"></div>`
        ).join('');
      }
      
      // Step content
      if (contentEl && steps[step]) {
        contentEl.innerHTML = `
          <div class="tutorial-step active">
            <h3 class="tutorial-step-title">${this.esc(steps[step].title)}</h3>
            <p class="tutorial-step-text">${this.esc(steps[step].text)}</p>
          </div>
        `;
      }
      
      // Buttons
      if (prevBtn) {
        prevBtn.textContent = this.t('tutorialPrev');
        prevBtn.style.display = step > 0 ? 'block' : 'none';
      }
      if (nextBtn) {
        nextBtn.textContent = this.t('tutorialNext');
        nextBtn.style.display = step < steps.length - 1 ? 'block' : 'none';
      }
      if (skipBtn) {
        skipBtn.textContent = this.t('tutorialSkip');
      }
      if (finishBtn) {
        finishBtn.textContent = this.t('tutorialFinish');
        finishBtn.style.display = step === steps.length - 1 ? 'block' : 'none';
      }
      
      // Event-Handler nach dem Rendern binden
      setTimeout(() => {
        this.bindTutorialEvents();
      }, 50);
    },
    nextTutorialStep: function() {
      const maxSteps = 4;
      if (this.state.tutorialStep < maxSteps - 1) {
        this.state.tutorialStep = (this.state.tutorialStep || 0) + 1;
        this.renderTutorial();
      }
    },
    prevTutorialStep: function() {
      if (this.state.tutorialStep > 0) {
        this.state.tutorialStep = (this.state.tutorialStep || 0) - 1;
        this.renderTutorial();
      }
    },
    bindTutorialEvents: function() {
      const self = this;
      
      // Tutorial modal buttons - Event-Handler neu binden, um sicherzustellen dass sie funktionieren
      const closeBtn = document.getElementById('tutorial-close');
      const skipBtn = document.getElementById('tutorial-skip');
      const nextBtn = document.getElementById('tutorial-next');
      const prevBtn = document.getElementById('tutorial-prev');
      const finishBtn = document.getElementById('tutorial-finish');
      const modal = document.getElementById('tutorial-modal');
      
      // Entferne alte Event-Handler (falls vorhanden) und binde neue
      if (closeBtn) {
        closeBtn.onclick = null; // Entferne alte Handler
        closeBtn.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          self.hideTutorial();
        };
      }
      if (skipBtn) {
        skipBtn.onclick = null;
        skipBtn.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          self.hideTutorial();
        };
      }
      if (nextBtn) {
        nextBtn.onclick = null;
        nextBtn.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          self.nextTutorialStep();
        };
      }
      if (prevBtn) {
        prevBtn.onclick = null;
        prevBtn.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          self.prevTutorialStep();
        };
      }
      if (finishBtn) {
        finishBtn.onclick = null;
        finishBtn.onclick = function(e) {
          e.preventDefault();
          e.stopPropagation();
          self.hideTutorial();
          self.state.view = 'templates';
          self.render();
        };
      }
      if (modal) {
        modal.onclick = function(e) {
          if (e.target === this) {
            self.hideTutorial();
          }
        };
      }
    },

  });
  document.getElementById("font-large")?.addEventListener("click", () => {
    document.documentElement.setAttribute("data-font", "large");
  });
  document.getElementById("font-xlarge")?.addEventListener("click", () => {
    document.documentElement.setAttribute("data-font", "xlarge");
  });

  // Sprache umschalten (DE <-> EN)
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        const lang = btn.dataset.lang;
        document.documentElement.setAttribute("lang", lang);
        APP.state.lang = lang;

        // Buttons visuell aktualisieren
        document.querySelectorAll(".lang-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        // Texte aktualisieren
        const t = APP.i18n[lang];
        const welcometitle = document.querySelector(".welcomeTitle");
        const welcomeDesc = document.querySelector(".welcome-description");
        if (welcometitle && welcomeDesc) {
            welcometitle.textContent = t.welcome;
            welcomeDesc.textContent = t.welcomeDesc;
        }

        // Schriftgrößen-Buttons
        document.getElementById("font-xsmall").textContent  = t.fontXSmall;
        document.getElementById("font-small").textContent  = t.fontSmall;
        document.getElementById("font-normal").textContent = t.fontNormal;
        document.getElementById("font-large").textContent  = t.fontLarge;
        document.getElementById("font-xlarge").textContent = t.fontXLarge;

        // Theme-Button
        document.getElementById("theme-btn").textContent = t.themeToggle;

        // Sprach-Buttons selbst
        document.getElementById("lang-de").textContent = t.langDE;
        document.getElementById("lang-en").textContent = t.langEN;
    });
  });
})();
</script>
  <!-- Tutorial Modal -->
  <div id="tutorial-modal" class="tutorial-modal" role="dialog" aria-modal="true" aria-labelledby="tutorial-title" tabindex="-1">
    <div class="tutorial-modal-content">
      <div class="tutorial-header">
        <h2 class="tutorial-title" id="tutorial-title"></h2>
        <button class="tutorial-close" id="tutorial-close" aria-label="Close" title="Close">×</button>
      </div>
      <div class="tutorial-progress" id="tutorial-progress"></div>
      <div id="tutorial-content"></div>
      <div class="tutorial-footer">
        <label class="tutorial-checkbox">
          <input type="checkbox" id="tutorial-dont-show">
          <span id="tutorial-dont-show-label"></span>
        </label>
        <div style="display:flex; gap:var(--space-2);">
          <button class="btn btn-secondary" id="tutorial-prev" style="display:none;"></button>
          <button class="btn btn-secondary" id="tutorial-skip"></button>
          <button class="btn btn-primary" id="tutorial-next"></button>
          <button class="btn btn-primary" id="tutorial-finish" style="display:none;"></button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
